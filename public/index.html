    <style>
        body {

        h1, h2, h3, h4, .font-display { font-family: 'Space Grotesk', sans-serif; }
        
        .white-rainbow-bg {
            background-color: #030712;
            background-image: 
                radial-gradient(at 15% 15%, rgba(255, 255, 255, 0.22) 0px, transparent 50%),
                radial-gradient(at 85% 20%, rgba(239, 68, 68, 0.2) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(255, 255, 255, 0.28) 0px, transparent 60%),
                radial-gradient(at 20% 85%, rgba(59, 130, 246, 0.2) 0px, transparent 50%),
                radial-gradient(at 85% 85%, rgba(168, 85, 247, 0.2) 0px, transparent 50%),
                linear-gradient(to bottom, #030712, #0b0f19);
            background-attachment: fixed;
        }

        .rainbow-glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(50px) saturate(280%);
            -webkit-backdrop-filter: blur(50px) saturate(280%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 45px 100px -15px rgba(0, 0, 0, 0.98), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .rainbow-card-hover {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .rainbow-card-hover:hover {
            transform: translateY(-12px) scale(1.03) rotateX(2deg) rotateY(-2deg);
            border-color: rgba(255, 255, 255, 0.75);
            box-shadow: 0 55px 120px -15px rgba(255, 255, 255, 0.5);
        }

        @keyframes whiteRainbowText {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .white-rainbow-animated-text {
            background: linear-gradient(135deg, #ffffff, #f43f5e, #fbbf24, #34d399, #38bdf8, #a855f7, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: whiteRainbowText 6s linear infinite;
        }

        .white-rainbow-btn {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 20%, #ef4444 40%, #10b981 60%, #0ea5e9 80%, #a855f7 100%);
            background-size: 250% auto;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            color: #030712;
            font-weight: 900;
            box-shadow: 0 6px 30px rgba(255, 255, 255, 0.5);
        }
        .white-rainbow-btn:hover {
            background-position: right center;
            box-shadow: 0 12px 50px rgba(255, 255, 255, 0.9);
            transform: translateY(-4px) scale(1.05);
            color: #ffffff;
        }

        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1.5deg); }
        }
        .floating-badge {
            animation: floatAnim 3.5s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.9; box-shadow: 0 0 25px rgba(255,255,255,0.5); }
            50% { opacity: 1; box-shadow: 0 0 55px rgba(255,255,255,1); }
        }
        .pulse-glow-effect {
            animation: pulseGlow 2.5s ease-in-out infinite;
        }

        @keyframes dropFallExhilarating {
            0% { transform: translateY(-40px) scale(0.4) rotate(-10deg); opacity: 0; }
            70% { transform: translateY(8px) scale(1.08) rotate(2deg); opacity: 1; }
            100% { transform: translateY(0px) scale(1) rotate(0deg); opacity: 1; }
        }

        .raindrop-pill {
            position: relative;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(15, 23, 42, 0.92));
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 20px 45px -5px rgba(0, 0, 0, 0.8), inset 0 2px 5px rgba(255, 255, 255, 0.5);
            animation: dropFallExhilarating 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.3) both;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        .raindrop-pill::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 25%;
            width: 40%;
            height: 5px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 999px;
            filter: blur(0.5px);
        }
        .raindrop-pill:hover {
            transform: translateY(-8px) scale(1.12);
            border-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 25px 60px rgba(255, 255, 255, 0.45), inset 0 2px 8px rgba(255, 255, 255, 0.9);
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.35), rgba(30, 41, 59, 0.98));
        }
        .raindrop-active {
            background: linear-gradient(135deg, #ffffff 0%, #f43f5e 30%, #38bdf8 70%, #a855f7 100%);
            color: #030712 !important;
            font-weight: 900;
            border: 1px solid #ffffff;
            box-shadow: 0 0 45px rgba(255, 255, 255, 0.95), inset 0 2px 8px rgba(255, 255, 255, 1);
            transform: scale(1.15) translateY(-5px);
        }

        .cinematic-stage {
            perspective: 1400px;
            transform-style: preserve-3d;
        }
        .cinematic-card-3d {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.6s ease;
            transform: rotateX(5deg) rotateY(-5deg);
        }
        .cinematic-card-3d:hover {
            transform: rotateX(0deg) rotateY(0deg) scale(1.04) translateY(-8px);
            box-shadow: 0 60px 120px -20px rgba(255, 255, 255, 0.5);
        }

        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            width: 100%;
        }
        .marquee-track {
            display: inline-block;
            animation: marqueeScroll 22s linear infinite;
        }
        .marquee-track:hover {
            animation-play-state: paused;
        }
        @keyframes marqueeScroll {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

                                <img src={activeModalProduct.img} alt="Product" className="w-full h-52 object-cover rounded-2xl bg-slate-900 border border-slate-800" onError={(e)=>{e.target.onerror=null; e.target.src=FALLBACK_SVG;}}/>
                                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed font-medium">{activeModalProduct.desc}</p>
                                <div className="flex justify-between items-center pt-4 border-t border-white/20">
                                    <span className="text-xl font-black text-white font-mono">R {activeModalProduct.price.toFixed(2)}</span>
                                    <button onClick={() => { addToCart(activeModalProduct.title, activeModalProduct.price); setActiveModalProduct(null); }} className="white-rainbow-btn text-slate-950 font-extrabold px-5 py-3 rounded-2xl text-xs shadow-xl">+ Add to Cart</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toastMessage && (
                        <div className="fixed bottom-6 left-6 rainbow-glass border border-red-400 text-white text-xs font-black px-6 py-4 rounded-2xl shadow-xl z-50 animate-fade-in font-mono pulse-glow-effect">
                            {toastMessage}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
