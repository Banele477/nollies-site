<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nollie's | eNanda Premier Hub & 2070 Quantum Gold Marketplace</title>
    <meta name="theme-color" content="#060913">
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #04060d;
        }
        h1, h2, h3, h4, .font-display { font-family: 'Space Grotesk', sans-serif; }
        
        .cyber-gold-bg {
            background-color: #04060d;
            background-image: 
                radial-gradient(at 15% 10%, rgba(212, 175, 55, 0.22) 0px, transparent 55%),
                radial-gradient(at 85% 20%, rgba(245, 158, 11, 0.18) 0px, transparent 55%),
                radial-gradient(at 50% 90%, rgba(6, 182, 212, 0.12) 0px, transparent 55%),
                linear-gradient(to bottom, rgba(4, 6, 13, 0.92), rgba(4, 6, 13, 0.99));
            background-attachment: fixed;
        }

        .cyber-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(212, 175, 55, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(212, 175, 55, 0.03) 1px, transparent 1px);
        }

        .cyber-glass-gold {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 0 40px -10px rgba(212, 175, 55, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .gold-holo-text {
            background: linear-gradient(135deg, #ffffff 0%, #fef08a 30%, #f59e0b 65%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-button-primary {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            color: #ffffff;
        }
        .gold-button-primary:hover {
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.65);
            transform: translateY(-2px);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes pulseGoldGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.65; transform: scale(1.08); }
        }
        @keyframes floatHolo {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(0.4deg); }
        }

        .animate-glow-slow { animation: pulseGoldGlow 6s ease-in-out infinite; }
        .animate-holo { animation: floatHolo 5s ease-in-out infinite; }

        .cyber-card {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cyber-card:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: rgba(245, 158, 11, 0.6);
            box-shadow: 0 25px 50px -12px rgba(212, 175, 55, 0.3);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen pb-32 cyber-gold-bg cyber-grid overflow-x-hidden selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const PRODUCTS = [
            { id: 'c1', cat: 'cereal', title: 'Cereal Hamper Package 1', price: 250, badge: '5 Items', desc: 'Jungle Oats 1kg, Future Life 500g, Noodles, Bokomo Corn Flakes 1kg, Weet-Bix 450g.', img: 'https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=600&q=80' },
            { id: 'c2', cat: 'cereal', title: 'Cereal Hamper Package 2', price: 250, badge: '5 Items', desc: 'Bokomo Corn Flakes 1kg, Rice Puffs, Juice, Porridge, Noodles.', img: 'https://images.unsplash.com/photo-1517093788734-90fa7b733160?auto=format&fit=crop&w=600&q=80' },
            { id: 'c3', cat: 'cereal', title: 'Cereal Hamper Package 3', price: 250, badge: '5 Items', desc: 'Bokomo Weet-Bix 450g, Corn Flakes 1kg, Future Life 500g, Nutrifics 450g, Noodles.', img: 'https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=600&q=80' },
            { id: 'b1', cat: 'essentials', title: 'Family Bulk Grocery Hamper', price: 380, badge: 'Best Value', desc: '10kg Maize Meal, 5L Sunflower Oil, 2kg White Sugar, 2kg Rice, 410g Baked Beans (x4).', img: 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80' },
            { id: 'b2', cat: 'essentials', title: 'Weekend Braai & Pap Combo', price: 295, badge: 'Weekend Special', desc: '5kg Iwisa Maize Meal, Braai Spice, Chakalaka (x3), Tomato & Onion Mix, 2L Soft Drink.', img: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80' },
            { id: 'j1', cat: 'juice', title: 'Juices Africa (4L Bottle)', price: 160, badge: 'Makes 20L', desc: 'Guava, Mixed Berry, Tropical Punch high yield fruit concentrate.', img: 'https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=600&q=80' },
            { id: 'p1', cat: 'perfume', title: 'M-Scents Perfumes (40ml)', price: 120, badge: '40ml Luxury', desc: 'Silver Sense, Red Dezire, White OUD, Blue Dezire, StallioN.', img: 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=600&q=80' },
            { id: 'p2', cat: 'perfume', title: 'M-Scents Duo Gift Set (2x 40ml)', price: 192, badge: 'Save R48', desc: 'Choose any two signature 40ml luxury fragrances in a gift presentation box.', img: 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=600&q=80' },
            { id: 'e1', cat: 'essentials', title: 'Fresh Bakery Daily Pack', price: 35, badge: 'Fresh Daily', desc: 'Fresh loaf, rolls, and morning treats.', img: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80' },
            { id: 'e3', cat: 'essentials', title: 'Cleaning & Hygiene Household Bucket', price: 185, badge: 'Home Care', desc: 'Dishwashing Liquid, Bleach, Washing Powder (2kg), and Floor Cleaner.', img: 'https://images.unsplash.com/photo-1585421514284-efb74c2b69ba?auto=format&fit=crop&w=600&q=80' }
        ];

        const HAMPER_OPTIONS = [
            { name: 'Jungle Oats 1kg', category: 'Cereal' },
            { name: 'Future Life 500g', category: 'Cereal' },
            { name: 'Bokomo Corn Flakes 1kg', category: 'Cereal' },
            { name: 'Weet-Bix 450g', category: 'Cereal' },
            { name: 'Nutrifics 450g', category: 'Cereal' },
            { name: 'Happy Valley Rice Puffs', category: 'Cereal' },
            { name: 'Kellogg\'s Noodles (5 Pack)', category: 'Snacks' },
            { name: 'Juice Concentrate 300ml', category: 'Beverage' }
        ];

        const BOOKABLE_SERVICES = [
            { id: 's1', title: 'Doorstep Hamper Consultation & Delivery', price: 50, duration: '30 min', desc: 'In-person assistance selecting household groceries & bulk hampers in eNanda.' },
            { id: 's2', title: 'M-Scents Fragrance Sampling Session', price: 0, duration: '20 min', desc: 'Sample signature M-Scents perfumes at our local eNanda hub point.' },
            { id: 's3', title: 'Mbango VA Admin & Business Support', price: 150, duration: '45 min', desc: 'Virtual assistance, administrative support, document preparation, & digital advice.' }
        ];

        const REAL_WORLD_FEED = [
            "Sipho from eNanda A-Section just ordered a Cereal Hamper 1!",
            "Nomvula in Ntuzuma reserved a 4L Juices Africa Tropical Punch!",
            "Bongiwe booked an M-Scents Fragrance Sampling Session!",
            "Thabo placed an order for Family Bulk Grocery Hamper!",
            "Zanele from Inanda Glebe requested a custom 5-Item Cereal Hamper!"
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [cart, setCart] = useState(JSON.parse(localStorage.getItem('nollies_cart') || '[]'));
            const [orders, setOrders] = useState([]);
            const [bookings, setBookings] = useState([]);
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [promoCode, setPromoCode] = useState('');
            const [discountPercent, setDiscountPercent] = useState(0);
            const [selectedHamperItems, setSelectedHamperItems] = useState([]);
            const [activeModalProduct, setActiveModalProduct] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);
            const [liveActivityIndex, setLiveActivityIndex] = useState(0);

            const [customerName, setCustomerName] = useState(localStorage.getItem('nollies_customer_name') || '');
            const [customerPhone, setCustomerPhone] = useState(localStorage.getItem('nollies_customer_phone') || '');
            const [commPreference, setCommPreference] = useState('whatsapp');
            const [deliveryAddress, setDeliveryAddress] = useState(localStorage.getItem('nollies_customer_address') || '');
            const [paymentMethod, setPaymentMethod] = useState('COD'); 

            const [bookingService, setBookingService] = useState('Doorstep Hamper Consultation & Delivery');
            const [bookingDate, setBookingDate] = useState('2026-10-20');
            const [bookingTime, setBookingTime] = useState('10:00 AM');
            const [bookingNotes, setBookingNotes] = useState('');

            // DIRECT ANDROID APK DOWNLOAD (NO ZIP)
            const downloadDirectApk = () => {
                showToast('🤖 Downloading Nollie\'s Android APK...');
                const a = document.createElement('a');
                a.href = '/downloads/nollies.apk';
                a.download = 'NolliesHub.apk';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            useEffect(() => {
                localStorage.setItem('nollies_cart', JSON.stringify(cart));
            }, [cart]);

            useEffect(() => {
                localStorage.setItem('nollies_customer_name', customerName);
                localStorage.setItem('nollies_customer_phone', customerPhone);
                localStorage.setItem('nollies_customer_address', deliveryAddress);
            }, [customerName, customerPhone, deliveryAddress]);

            useEffect(() => {
                const interval = setInterval(() => {
                    setLiveActivityIndex((prev) => (prev + 1) % REAL_WORLD_FEED.length);
                }, 4000);
                return () => clearInterval(interval);
            }, []);

            const fetchOrders = () => {
                fetch('/api/orders')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.orders) {
                            setOrders(data.orders);
                            localStorage.setItem('nollies_orders', JSON.stringify(data.orders));
                        }
                    })
                    .catch(err => {
                        const local = JSON.parse(localStorage.getItem('nollies_orders') || '[]');
                        setOrders(local);
                    });
            };

            const fetchBookings = () => {
                fetch('/api/bookings')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.bookings) setBookings(data.bookings);
                    })
                    .catch(err => console.error(err));
            };

            useEffect(() => {
                fetchOrders();
                fetchBookings();
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const addToCart = (title, price) => {
                setCart([...cart, { title, price }]);
                showToast(`🛒 ${title} loaded into Gold Cart`);
            };

            const removeFromCart = (index) => {
                const newCart = [...cart];
                newCart.splice(index, 1);
                setCart(newCart);
                showToast('Item ejected from cart.');
            };

            const handleHamperToggle = (name) => {
                if (selectedHamperItems.includes(name)) {
                    setSelectedHamperItems(selectedHamperItems.filter(i => i !== name));
                } else {
                    if (selectedHamperItems.length >= 5) {
                        alert('Quantum slot capacity reached! Maximum 5 items allowed.');
                        return;
                    }
                    setSelectedHamperItems([...selectedHamperItems, name]);
                }
            };

            const addCustomHamper = () => {
                if (selectedHamperItems.length < 5) {
                    alert('Please select 5 items to assemble your custom bundle!');
                    return;
                }
                addToCart(`Custom Hamper (${selectedHamperItems.join(', ')})`, 250);
                setSelectedHamperItems([]);
                setActiveTab('catalog');
            };

            const applyPromo = () => {
                if (promoCode.trim().toUpperCase() === 'NOLLIE10') {
                    setDiscountPercent(10);
                    showToast('🎉 Promo code verified: 10% Off!');
                } else {
                    alert('Invalid promo code!');
                }
            };

            const subtotal = cart.reduce((sum, item) => sum + item.price, 0);
            const discount = (subtotal * discountPercent) / 100;
            const deliveryFee = 30;
            const grandTotal = cart.length > 0 ? (subtotal - discount) + deliveryFee : 0;

            const handleCheckout = () => {
                if (cart.length === 0) {
                    alert('Your neural cart is empty!');
                    return;
                }

                if (!customerName.trim() || !customerPhone.trim()) {
                    alert('Please provide your Full Name and Contact Phone Number to complete payment.');
                    return;
                }

                const orderPayload = {
                    customer_name: customerName,
                    customer_phone: customerPhone,
                    comm_preference: commPreference,
                    delivery_address: deliveryAddress,
                    items: [...cart],
                    payment_method: paymentMethod,
                    payment_status: paymentMethod === 'COD' ? 'Pending (COD)' : 'Verified (Instant Gateway)',
                    total: grandTotal
                };

                fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                })
                .then(res => res.json())
                .then(data => {
                    if (data && data.order) {
                        const updated = [data.order, ...orders];
                        setOrders(updated);
                        localStorage.setItem('nollies_orders', JSON.stringify(updated));
                    }
                })
                .catch(err => {
                    const localFallback = { 
                        id: orders.length + 1, 
                        date: new Date().toLocaleString(), 
                        customer_name: customerName,
                        customer_phone: customerPhone,
                        comm_preference: commPreference,
                        delivery_address: deliveryAddress,
                        items: [...cart],
                        payment_method: paymentMethod,
                        payment_status: paymentMethod === 'COD' ? 'Pending (COD)' : 'Verified (Instant Gateway)',
                        total: grandTotal 
                    };
                    const updated = [localFallback, ...orders];
                    setOrders(updated);
                    localStorage.setItem('nollies_orders', JSON.stringify(updated));
                });

                let msg = `Hi Nollie's! Order from ${customerName} (${customerPhone}):%0A%0A`;
                msg += `Preferred Contact: ${commPreference.toUpperCase()}%0A`;
                msg += `Payment Gateway: ${paymentMethod}%0A`;
                if (deliveryAddress) msg += `Address: ${deliveryAddress}%0A%0A`;
                msg += `Items:%0A`;
                cart.forEach(i => msg += `• ${i.title} - R${i.price}%0A`);
                if (discountPercent > 0) msg += `%0ADiscount (${discountPercent}%): -R${discount.toFixed(2)}`;
                msg += `%0ADelivery Fee: R30%0A*Total: R${grandTotal.toFixed(2)}*`;

                setCart([]);
                setIsCartOpen(false);
                setActiveTab('orders');

                if (commPreference === 'whatsapp') {
                    window.open(`https://wa.me/27625873479?text=${msg}`, '_blank');
                } else if (commPreference === 'sms') {
                    window.open(`sms:+27625873479?body=${decodeURIComponent(msg)}`, '_blank');
                } else {
                    alert(`Order Logged via ${paymentMethod}! Nollie's dispatch team will call you directly at ${customerPhone} to confirm delivery in eNanda.`);
                }
            };

            const submitBooking = (e) => {
                e.preventDefault();
                if (!customerName.trim() || !customerPhone.trim()) {
                    alert('Please enter your Name and Phone Number to confirm your appointment.');
                    return;
                }

                const payload = {
                    customer_name: customerName,
                    customer_phone: customerPhone,
                    service_type: bookingService,
                    booking_date: bookingDate,
                    booking_time: bookingTime,
                    notes: bookingNotes
                };

                fetch('/api/bookings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    showToast('📅 Service Appointment Transmitted!');
                    fetchBookings();
                    setBookingNotes('');
                })
                .catch(err => {
                    showToast('📅 Appointment Synchronized Locally!');
                });
            };

            const filteredProducts = PRODUCTS.filter(p => {
                const matchesCat = selectedCategory === 'all' || p.cat === selectedCategory;
                const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || p.desc.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            const totalRevenue = orders.reduce((sum, o) => sum + (o.total || 0), 0);

            return (
                <div className="min-h-screen relative">
                    <div className="h-1 bg-gradient-to-r from-amber-400 via-yellow-500 to-amber-600 w-full fixed top-0 z-50 shadow-[0_0_20px_rgba(245,158,11,0.9)]"></div>

                    <header className="sticky top-1 z-40 cyber-glass-gold px-4 sm:px-10 py-3.5 flex justify-between items-center transition-all duration-300">
                        <div className="flex items-center space-x-3 cursor-pointer group" onClick={() => setActiveTab('home')}>
                            <div className="relative">
                                <img src={NOLLIE_AVATAR} alt="Nollie" className="w-12 h-12 rounded-2xl object-cover border-2 border-amber-400/70 shadow-[0_0_25px_rgba(245,158,11,0.5)] group-hover:scale-105 group-hover:border-amber-300 transition-all duration-300" />
                                <span className="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-amber-400 border-2 border-slate-950 rounded-full shadow-[0_0_10px_#f59e0b] animate-pulse"></span>
                            </div>
                            <div>
                                <h1 className="text-lg font-black tracking-wider text-white leading-none font-display uppercase flex items-center gap-1.5">
                                    Nollie's <span className="text-[9px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded border border-amber-500/40 font-mono">2070 GOLD</span>
                                </h1>
                                <span className="text-[10px] font-bold text-amber-200/70 tracking-widest uppercase">eNanda Quantum Hub</span>
                            </div>
                        </div>
                        
                        <nav className="hidden lg:flex items-center space-x-1.5 bg-slate-950/85 p-1.5 rounded-2xl border border-amber-500/20 text-xs font-bold text-slate-300 shadow-inner">
                            {[
                                { id: 'home', label: '🏠 Home' },
                                { id: 'catalog', label: '🛍️ Catalog' },
                                { id: 'builder', label: '✨ Hamper Builder' },
                                { id: 'booking', label: '📅 Booking' },
                                { id: 'specials', label: '🔥 Specials' },
                                { id: 'orders', label: '📦 Orders' },
                                { id: 'admin', label: '🔐 Owner Console' },
                                { id: 'privacy', label: '🔒 Security' }
                            ].map(tab => (
                                <button key={tab.id} onClick={() => { if(tab.id==='orders' || tab.id==='admin'){ fetchOrders(); fetchBookings(); } setActiveTab(tab.id); }} 
                                        className={`px-3.5 py-2 rounded-xl transition-all duration-300 ${activeTab === tab.id ? 'gold-button-primary font-extrabold shadow-lg scale-105' : 'hover:text-amber-300 hover:bg-slate-900/60'}`}>
                                    {tab.label}
                                </button>
                            ))}
                        </nav>

                        <div className="flex items-center space-x-2.5">
                            <button onClick={downloadDirectApk} className="press-effect flex items-center space-x-1.5 bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/60 text-amber-300 text-xs font-black px-4 py-2.5 rounded-2xl shadow-[0_0_15px_rgba(245,158,11,0.3)] transition-all">
                                <span>🤖</span>
                                <span className="hidden sm:inline">Download APK</span>
                            </button>

                            <button onClick={() => setIsCartOpen(true)} className="press-effect relative flex items-center space-x-2.5 gold-button-primary text-white text-xs font-black px-5 py-2.5 rounded-2xl shadow-[0_0_20px_rgba(245,158,11,0.4)] hover:scale-105 transition-all">
                                <span>🛒 Cart</span>
                                <span className="bg-slate-950 text-amber-300 border border-amber-500/50 text-[11px] rounded-full h-5 w-5 flex items-center justify-center font-black animate-pulse">{cart.length}</span>
                            </button>
                        </div>
                    </header>

                    <div className="lg:hidden flex overflow-x-auto bg-slate-950/90 border-b border-amber-500/20 px-3 py-2 space-x-2 text-xs font-bold no-scrollbar sticky top-[73px] z-30 backdrop-blur-md">
                        {[
                            { id: 'home', label: '🏠 Home' },
                            { id: 'catalog', label: '🛍️ Catalog' },
                            { id: 'builder', label: '✨ Hamper' },
                            { id: 'booking', label: '📅 Booking' },
                            { id: 'specials', label: '🔥 Specials' },
                            { id: 'orders', label: '📦 Orders' },
                            { id: 'admin', label: '🔐 Admin' }
                        ].map(tab => (
                            <button key={tab.id} onClick={() => { if(tab.id==='orders' || tab.id==='admin'){ fetchOrders(); fetchBookings(); } setActiveTab(tab.id); }} 
                                    className={`px-4 py-2 rounded-xl whitespace-nowrap transition-all ${activeTab === tab.id ? 'gold-button-primary font-black shadow-md' : 'text-slate-400 bg-slate-900/90 border border-slate-800'}`}>
                                {tab.label}
                            </button>
                        ))}
                    </div>

                    <div className="bg-slate-950/90 border-b border-white/5 text-slate-300 text-[11px] py-2 px-4 text-center font-medium shadow-inner flex items-center justify-center space-x-2">
                        <span className="inline-block w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_8px_#f59e0b] animate-ping"></span>
                        <span className="font-extrabold text-amber-400 uppercase tracking-widest font-mono text-[10px]">Quantum Feed:</span>
                        <span className="text-slate-200 font-semibold">{REAL_WORLD_FEED[liveActivityIndex]}</span>
                    </div>

                    <main className="max-w-6xl mx-auto px-4 mt-8 space-y-10 animate-fade-in">
                        {activeTab === 'home' && (

                                            ))
                                        )}
                                    </div>

                                    <div className="bg-slate-950/90 p-4 rounded-2xl border border-white/10 space-y-3">
                                        <span className="text-white font-extrabold block font-display">👤 Delivery & Contact Info:</span>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <input type="text" value={customerName} onChange={(e) => setCustomerName(e.target.value)} placeholder="Full Name *" className="px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-amber-400"/>
                                            <input type="tel" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} placeholder="Phone Number (e.g. 0625873479) *" className="px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-amber-400"/>
                                        </div>
                                        <input type="text" value={deliveryAddress} onChange={(e) => setDeliveryAddress(e.target.value)} placeholder="eNanda Sector / Street Address" className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-amber-400"/>

                                        <div className="space-y-2 pt-2 border-t border-white/10">
                                            <span className="text-white font-extrabold block font-display">💳 Payment Method:</span>
                                            <div className="grid grid-cols-3 gap-2">
                                                <button onClick={() => setPaymentMethod('COD')} className={`p-2.5 rounded-xl border text-[11px] font-bold text-center transition-all ${paymentMethod === 'COD' ? 'bg-amber-600 text-white border-amber-400 shadow-md' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>💵 Cash on Delivery</button>
                                                <button onClick={() => setPaymentMethod('CAPITEC_PAY')} className={`p-2.5 rounded-xl border text-[11px] font-bold text-center transition-all ${paymentMethod === 'CAPITEC_PAY' ? 'bg-amber-500 text-white border-amber-300 shadow-md' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>📲 Capitec / EFT</button>
                                                <button onClick={() => setPaymentMethod('CARD_ONLINE')} className={`p-2.5 rounded-xl border text-[11px] font-bold text-center transition-all ${paymentMethod === 'CARD_ONLINE' ? 'bg-amber-700 text-white border-amber-500 shadow-md' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>💳 Online Card</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="py-3 border-t border-white/10 flex space-x-2.5">
                                    <input type="text" value={promoCode} onChange={(e) => setPromoCode(e.target.value)} placeholder="Promo code (NOLLIE10)" className="flex-1 px-4 py-3 text-xs rounded-xl bg-slate-900 border border-slate-700 text-white uppercase outline-none"/>
                                    <button onClick={applyPromo} className="press-effect gold-button-primary text-white text-xs font-black px-5 py-3 rounded-xl shadow">Apply</button>
                                </div>

                                <div className="border-t border-white/10 pt-4 space-y-2.5 text-xs">
                                    <div className="flex justify-between text-slate-300 font-medium font-mono"><span>Subtotal:</span><span>R {subtotal.toFixed(2)}</span></div>
                                    <div className="flex justify-between text-slate-300 font-medium font-mono"><span>Discount:</span><span className="text-amber-400">-R {discount.toFixed(2)}</span></div>
                                    <div className="flex justify-between text-slate-300 font-medium font-mono"><span>Delivery Fee (eNanda):</span><span>R 30.00</span></div>
                                    <div className="flex justify-between text-lg font-black text-white pt-2 border-t border-white/10"><span>Total:</span><span className="text-amber-400 font-mono font-extrabold">R {grandTotal.toFixed(2)}</span></div>
                                    <button onClick={handleCheckout} className="press-effect w-full gold-button-primary text-white font-extrabold py-4 rounded-2xl text-sm shadow-xl mt-2 flex items-center justify-center space-x-2 hover:scale-[1.01] transition-transform">
                                        <span>Pay R{grandTotal.toFixed(2)} & Complete Order 🚀</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeModalProduct && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="cyber-glass-gold rounded-3xl p-6 sm:p-8 border border-amber-500/40 max-w-md w-full space-y-5 shadow-2xl">
                                <div className="flex justify-between items-center border-b border-white/10 pb-4">
                                    <h3 className="font-black text-base text-white font-display">{activeModalProduct.title}</h3>
                                    <button onClick={() => setActiveModalProduct(null)} className="press-effect text-slate-400 text-xl font-bold bg-slate-900 w-9 h-9 rounded-full flex items-center justify-center hover:bg-slate-800">&times;</button>
                                </div>
                                <img src={activeModalProduct.img} alt="Product" className="w-full h-52 object-cover rounded-2xl bg-slate-900 border border-slate-800 opacity-95" onError={(e)=>{e.target.onerror=null; e.target.src=FALLBACK_SVG;}}/>
                                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed font-medium">{activeModalProduct.desc}</p>
                                <div className="flex justify-between items-center pt-4 border-t border-white/10">
                                    <span className="text-xl font-black text-amber-400 font-mono">R {activeModalProduct.price.toFixed(2)}</span>
                                    <button onClick={() => { addToCart(activeModalProduct.title, activeModalProduct.price); setActiveModalProduct(null); }} className="press-effect gold-button-primary text-white font-extrabold px-6 py-3.5 rounded-2xl text-xs shadow-xl hover:scale-105 transition-transform">+ Add to Cart</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 cyber-glass-gold border border-amber-400 text-amber-300 text-xs font-black px-6 py-4 rounded-2xl shadow-[0_0_25px_rgba(245,158,11,0.4)] z-50 animate-fade-in font-mono">
                            {toastMessage}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
