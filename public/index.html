<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nollie's | eNanda Premier Hub & Marketplace</title>
    <meta name="theme-color" content="#090d16">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM 18 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX Transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .silver-gradient { background: linear-gradient(135deg, #f8fafc, #cbd5e1, #64748b); }
        .silver-border { border-color: rgba(226, 232, 240, 0.15); }
        .silver-text {
            background: linear-gradient(90deg, #ffffff, #e2e8f0, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-glass {
            background: rgba(13, 18, 30, 0.94);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
        }
        .bg-community {
            background-color: #090d16;
            background-image: radial-gradient(circle at 50% 0%, rgba(30, 41, 59, 0.75) 0%, rgba(9, 13, 22, 0.98) 100%);
        }
        .press-effect:active { transform: scale(0.96); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(1.05); }
        }

        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-float { animation: floatSlow 4s ease-in-out infinite; }
        .animate-glow { animation: pulseGlow 6s ease-in-out infinite; }
        .card-hover { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .card-hover:hover { transform: translateY(-4px); border-color: rgba(226, 232, 240, 0.35); box-shadow: 0 20px 40px -15px rgba(0,0,0,0.7); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-32 bg-community overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const NOLLIE_AVATAR = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80";
        const FALLBACK_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400' viewBox='0 0 600 400'><rect width='100%' height='100%' fill='%231e293b'/><text x='50%' y='50%' fill='%23cbd5e1' font-family='sans-serif' font-size='22' font-weight='bold' text-anchor='middle' dominant-baseline='middle'>Nollie%27s Hub Pack</text></svg>";

        const PRODUCTS = [
            { id: 'c1', cat: 'cereal', title: 'Cereal Hamper Package 1', price: 250, badge: '5 Items', desc: 'Jungle Oats 1kg, Future Life 500g, Noodles, Bokomo Corn Flakes 1kg, Weet-Bix 450g.', img: 'https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=600&q=80' },
            { id: 'c2', cat: 'cereal', title: 'Cereal Hamper Package 2', price: 250, badge: '5 Items', desc: 'Bokomo Corn Flakes 1kg, Rice Puffs, Juice, Porridge, Noodles.', img: 'https://images.unsplash.com/photo-1517093788734-90fa7b733160?auto=format&fit=crop&w=600&q=80' },
            { id: 'c3', cat: 'cereal', title: 'Cereal Hamper Package 3', price: 250, badge: '5 Items', desc: 'Bokomo Weet-Bix 450g, Corn Flakes 1kg, Future Life 500g, Nutrifics 450g, Noodles.', img: 'https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=600&q=80' },
            { id: 'b1', cat: 'essentials', title: 'Family Bulk Grocery Hamper', price: 380, badge: 'Best Value', desc: '10kg Maize Meal, 5L Sunflower Oil, 2kg White Sugar, 2kg Rice, 410g Baked Beans (x4).', img: 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80' },
            { id: 'b2', cat: 'essentials', title: 'Weekend Braai & Pap Combo', price: 295, badge: 'Weekend Special', desc: '5kg Iwisa Maize Meal, Braai Spice, Chakalaka (x3), Tomato & Onion Mix, 2L Soft Drink.', img: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80' },
            { id: 'j1', cat: 'juice', title: 'Juices Africa (4L Bottle)', price: 160, badge: 'Makes 20L', desc: 'Guava, Mixed Berry, Tropical Punch high yield fruit concentrate.', img: 'https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=600&q=80' },
            { id: 'p1', cat: 'perfume', title: 'M-Scents Perfumes (40ml)', price: 120, badge: '40ml Luxury', desc: 'Silver Sense, Red Dezire, White OUD, Blue Dezire, StallioN.', img: 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=600&q=80' },
            { id: 'p2', cat: 'perfume', title: 'M-Scents Duo Gift Set (2x 40ml)', price: 192, badge: 'Save R48', desc: 'Choose any two signature 40ml luxury fragrances in a gift presentation box.', img: 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=600&q=80' },
            { id: 'e1', cat: 'essentials', title: 'Fresh Bakery Daily Pack', price: 35, badge: 'Fresh Daily', desc: 'Fresh loaf, rolls, and morning treats.', img: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80' },
            { id: 'e3', cat: 'essentials', title: 'Cleaning & Hygiene Household Bucket', price: 185, badge: 'Home Care', desc: 'Dishwashing Liquid, Bleach, Washing Powder (2kg), and Floor Cleaner.', img: 'https://images.unsplash.com/photo-1585421514284-efb74c2b69ba?auto=format&fit=crop&w=600&q=80' }
        ];

        const HAMPER_OPTIONS = [
            { name: 'Jungle Oats 1kg', category: 'Cereal' },
            { name: 'Future Life 500g', category: 'Cereal' },
            { name: 'Bokomo Corn Flakes 1kg', category: 'Cereal' },
            { name: 'Weet-Bix 450g', category: 'Cereal' },
            { name: 'Nutrifics 450g', category: 'Cereal' },
            { name: 'Happy Valley Rice Puffs', category: 'Cereal' },
            { name: 'Kellogg\'s Noodles (5 Pack)', category: 'Snacks' },
            { name: 'Juice Concentrate 300ml', category: 'Beverage' }
        ];

        const BOOKABLE_SERVICES = [
            { id: 's1', title: 'Doorstep Hamper Consultation & Delivery', price: 50, duration: '30 min', desc: 'In-person assistance selecting household groceries & bulk hampers in eNanda.' },
            { id: 's2', title: 'M-Scents Fragrance Sampling Session', price: 0, duration: '20 min', desc: 'Sample signature M-Scents perfumes at our local eNanda hub point.' },
            { id: 's3', title: 'Mbango VA Admin & Business Assistance', price: 150, duration: '45 min', desc: 'Virtual assistance, administrative support, document preparation, & digital advice.' }
        ];

        const REAL_WORLD_FEED = [
            "Sipho from eNanda A-Section just ordered a Cereal Hamper 1!",
            "Nomvula in Ntuzuma reserved a 4L Juices Africa Tropical Punch!",
            "Bongiwe booked an M-Scents Fragrance Sampling Session!",
            "Thabo placed an order for Family Bulk Grocery Hamper!",
            "Zanele from Inanda Glebe requested a custom 5-Item Cereal Hamper!"
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [cart, setCart] = useState(JSON.parse(localStorage.getItem('nollies_cart') || '[]'));
            const [orders, setOrders] = useState([]);
            const [bookings, setBookings] = useState([]);
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [promoCode, setPromoCode] = useState('');
            const [discountPercent, setDiscountPercent] = useState(0);
            const [selectedHamperItems, setSelectedHamperItems] = useState([]);
            const [activeModalProduct, setActiveModalProduct] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);
            const [liveActivityIndex, setLiveActivityIndex] = useState(0);

            // Customer Contact & Delivery Info State
            const [customerName, setCustomerName] = useState(localStorage.getItem('nollies_customer_name') || '');
            const [customerPhone, setCustomerPhone] = useState(localStorage.getItem('nollies_customer_phone') || '');
            const [commPreference, setCommPreference] = useState('whatsapp');
            const [deliveryAddress, setDeliveryAddress] = useState(localStorage.getItem('nollies_customer_address') || '');
            const [paymentMethod, setPaymentMethod] = useState('COD'); // 'COD', 'EFT', 'CAPITEC_PAY'

            // Booking Form State
            const [bookingService, setBookingService] = useState('Doorstep Hamper Consultation & Delivery');
            const [bookingDate, setBookingDate] = useState('2026-10-20');
            const [bookingTime, setBookingTime] = useState('10:00');
            const [bookingNotes, setBookingNotes] = useState('');

            useEffect(() => {
                localStorage.setItem('nollies_cart', JSON.stringify(cart));
            }, [cart]);

            useEffect(() => {
                localStorage.setItem('nollies_customer_name', customerName);
                localStorage.setItem('nollies_customer_phone', customerPhone);
                localStorage.setItem('nollies_customer_address', deliveryAddress);
            }, [customerName, customerPhone, deliveryAddress]);

            useEffect(() => {
                const interval = setInterval(() => {
                    setLiveActivityIndex((prev) => (prev + 1) % REAL_WORLD_FEED.length);
                }, 5000);
                return () => clearInterval(interval);
            }, []);

            const fetchOrders = () => {
                fetch('/api/orders')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.orders) {
                            setOrders(data.orders);
                            localStorage.setItem('nollies_orders', JSON.stringify(data.orders));
                        }
                    })
                    .catch(err => {
                        const local = JSON.parse(localStorage.getItem('nollies_orders') || '[]');
                        setOrders(local);
                    });
            };

            const fetchBookings = () => {
                fetch('/api/bookings')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.bookings) setBookings(data.bookings);
                    })
                    .catch(err => console.error(err));
            };

            useEffect(() => {
                fetchOrders();
                fetchBookings();
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 2500);
            };

            const addToCart = (title, price) => {
                setCart([...cart, { title, price }]);
                showToast(`🛒 Added ${title} to cart!`);
            };

            const removeFromCart = (index) => {
                const newCart = [...cart];
                newCart.splice(index, 1);
                setCart(newCart);
                showToast('Item removed from cart.');
            };

            const handleHamperToggle = (name) => {
                if (selectedHamperItems.includes(name)) {
                    setSelectedHamperItems(selectedHamperItems.filter(i => i !== name));
                } else {
                    if (selectedHamperItems.length >= 5) {
                        alert('You can only select up to 5 items for your custom hamper!');
                        return;
                    }
                    setSelectedHamperItems([...selectedHamperItems, name]);
                }
            };

            const addCustomHamper = () => {
                if (selectedHamperItems.length < 5) {
                    alert('Please select exactly 5 items for your custom hamper!');
                    return;
                }
                addToCart(`Custom Hamper (${selectedHamperItems.join(', ')})`, 250);
                setSelectedHamperItems([]);
                setActiveTab('catalog');
            };

            const applyPromo = () => {
                if (promoCode.trim().toUpperCase() === 'NOLLIE10') {
                    setDiscountPercent(10);
                    showToast('🎉 Promo code applied: 10% Off!');
                } else {
                    alert('Invalid promo code!');
                }
            };

            const subtotal = cart.reduce((sum, item) => sum + item.price, 0);
            const discount = (subtotal * discountPercent) / 100;
            const deliveryFee = 30;
            const grandTotal = cart.length > 0 ? (subtotal - discount) + deliveryFee : 0;

            const handleCheckout = () => {
                if (cart.length === 0) {
                    alert('Your cart is empty!');
                    return;
                }

                if (!customerName.trim() || !customerPhone.trim()) {
                    alert('Please enter your Name and Contact Phone Number before completing checkout.');
                    return;
                }

                const orderPayload = {
                    customer_name: customerName,
                    customer_phone: customerPhone,
                    comm_preference: commPreference,
                    delivery_address: deliveryAddress,
                    items: [...cart],
                    payment_method: paymentMethod,
                    payment_status: paymentMethod === 'COD' ? 'Pending (COD)' : 'Verified (Instant Gateway)',
                    total: grandTotal
                };

                fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                })
                .then(res => res.json())
                .then(data => {
                    if (data && data.order) {
                        const updated = [data.order, ...orders];
                        setOrders(updated);
                        localStorage.setItem('nollies_orders', JSON.stringify(updated));
                    }
                })
                .catch(err => {
                    const localFallback = { 
                        id: orders.length + 1, 
                        date: new Date().toLocaleString(), 
                        customer_name: customerName,
                        customer_phone: customerPhone,
                        comm_preference: commPreference,
                        delivery_address: deliveryAddress,
                        items: [...cart],
                        payment_method: paymentMethod,
                        payment_status: paymentMethod === 'COD' ? 'Pending (COD)' : 'Verified (Instant Gateway)',
                        total: grandTotal 
                    };
                    const updated = [localFallback, ...orders];
                    setOrders(updated);
                    localStorage.setItem('nollies_orders', JSON.stringify(updated));
                });

                let msg = `Hi Nollie's! Order from ${customerName} (${customerPhone}):%0A%0A`;
                msg += `Preferred Contact: ${commPreference.toUpperCase()}%0A`;
                msg += `Payment Gateway: ${paymentMethod}%0A`;
                if (deliveryAddress) msg += `Address: ${deliveryAddress}%0A%0A`;
                msg += `Items:%0A`;
                cart.forEach(i => msg += `• ${i.title} - R${i.price}%0A`);
                if (discountPercent > 0) msg += `%0ADiscount (${discountPercent}%): -R${discount.toFixed(2)}`;
                msg += `%0ADelivery Fee: R30%0A*Total: R${grandTotal.toFixed(2)}*`;

                setCart([]);
                setIsCartOpen(false);
                setActiveTab('orders');

                if (commPreference === 'whatsapp') {
                    window.open(`https://wa.me/27625873479?text=${msg}`, '_blank');
                } else if (commPreference === 'sms') {
                    window.open(`sms:+27625873479?body=${decodeURIComponent(msg)}`, '_blank');
                } else {
                    alert(`Order Logged via ${paymentMethod}! Nollie's dispatch team will call you directly at ${customerPhone} to confirm delivery in eNanda.`);
                }
            };

            const submitBooking = (e) => {
                e.preventDefault();
                if (!customerName.trim() || !customerPhone.trim()) {
                    alert('Please enter your Name and Phone Number to confirm your booking.');
                    return;
                }

                const payload = {
                    customer_name: customerName,
                    customer_phone: customerPhone,
                    service_type: bookingService,
                    booking_date: bookingDate,
                    booking_time: bookingTime,
                    notes: bookingNotes
                };

                fetch('/api/bookings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    showToast('📅 Service Booking Confirmed!');
                    fetchBookings();
                    setBookingNotes('');
                })
                .catch(err => {
                    showToast('📅 Booking Saved Locally!');
                });
            };

            const filteredProducts = PRODUCTS.filter(p => {
                const matchesCat = selectedCategory === 'all' || p.cat === selectedCategory;
                const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || p.desc.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            const totalRevenue = orders.reduce((sum, o) => sum + (o.total || 0), 0);
            const avgOrderVal = orders.length > 0 ? totalRevenue / orders.length : 0;

            return (
                <div className="min-h-screen">
                    <div className="h-1 silver-gradient w-full fixed top-0 z-50"></div>

                    {/* Navigation Header */}
                    <header className="sticky top-1 z-40 bg-glass border-b silver-border px-4 sm:px-12 py-4 flex justify-between items-center shadow-2xl">
                        <div className="flex items-center space-x-3 cursor-pointer group" onClick={() => setActiveTab('home')}>
                            <div className="relative">
                                <img src={NOLLIE_AVATAR} alt="Nollie" className="w-11 h-11 rounded-2xl object-cover border silver-border shadow-xl group-hover:scale-105 transition-transform" />
                                <span className="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-emerald-500 border-2 border-slate-950 rounded-full"></span>
                            </div>
                            <div>
                                <h1 className="text-base font-extrabold tracking-tight text-white leading-none">Nollie's</h1>
                                <span className="text-[10px] font-semibold text-slate-400 tracking-widest uppercase">eNanda Premier Hub</span>
                            </div>
                        </div>
                        
                        {/* Desktop Navigation Tabs */}
                        <nav className="hidden md:flex items-center space-x-2 bg-slate-900/90 p-1.5 rounded-2xl border silver-border text-xs font-bold text-slate-300">
                            <button onClick={() => setActiveTab('home')} className={`px-4 py-2 rounded-xl transition-all ${activeTab === 'home' ? 'silver-gradient text-slate-950 font-black shadow-lg scale-105' : 'hover:text-white'}`}>🏠 Home</button>
                            <button onClick={() => setActiveTab('catalog')} className={`px-4 py-2 rounded-xl transition-all ${activeTab === 'catalog' ? 'silver-gradient text-slate-950 font-black shadow-lg scale-105' : 'hover:text-white'}`}>🛍️ Catalog</button>
                            <button onClick={() => setActiveTab('builder')} className={`px-4 py-2 rounded-xl transition-all ${activeTab === 'builder' ? 'silver-gradient text-slate-950 font-black shadow-lg scale-105' : 'hover:text-white'}`}>✨ Hamper Builder</button>
                            <button onClick={() => setActiveTab('booking')} className={`px-4 py-2 rounded-xl transition-all ${activeTab === 'booking' ? 'silver-gradient text-slate-950 font-black shadow-lg scale-105' : 'hover:text-white'}`}>📅 Book Service</button>
                            <button onClick={() => setActiveTab('specials')} className={`px-4 py-2 rounded-xl transition-all ${activeTab === 'specials' ? 'silver-gradient text-slate-950 font-black shadow-lg scale-105' : 'hover:text-white'}`}>🔥 Bulk Specials</button>
                            <button onClick={() => { fetchOrders(); fetchBookings(); setActiveTab('orders'); }} className={`px-4 py-2 rounded-xl transition-all ${activeTab === 'orders' ? 'silver-gradient text-slate-950 font-black shadow-lg scale-105' : 'hover:text-white'}`}>📦 My Orders</button>
                            <button onClick={() => { fetchOrders(); fetchBookings(); setActiveTab('admin'); }} className={`px-4 py-2 rounded-xl transition-all ${activeTab === 'admin' ? 'silver-gradient text-slate-950 font-black shadow-lg scale-105' : 'hover:text-white'}`}>🔐 Owner Admin</button>
                            <button onClick={() => setActiveTab('privacy')} className={`px-4 py-2 rounded-xl transition-all ${activeTab === 'privacy' ? 'silver-gradient text-slate-950 font-black shadow-lg scale-105' : 'hover:text-white'}`}>🔒 Privacy</button>
                        </nav>

                        <div className="flex items-center space-x-3">
                            <button onClick={() => setIsCartOpen(true)} className="press-effect relative flex items-center space-x-2.5 silver-gradient text-slate-950 text-xs font-extrabold px-5 py-2.5 rounded-xl shadow-xl hover:opacity-95 transition-all">
                                <span>🛒 Cart</span>
                                <span className="bg-slate-950 text-slate-100 text-[11px] rounded-full h-5 w-5 flex items-center justify-center font-black animate-pulse">{cart.length}</span>
                            </button>
                        </div>
                    </header>

                    {/* Mobile Navigation Bar */}
                    <div className="md:hidden flex overflow-x-auto bg-slate-900/90 border-b silver-border px-4 py-2 space-x-2 text-xs font-bold no-scrollbar sticky top-[73px] z-30">
                        <button onClick={() => setActiveTab('home')} className={`px-4 py-2 rounded-xl whitespace-nowrap transition-all ${activeTab === 'home' ? 'silver-gradient text-slate-950 font-black' : 'text-slate-300 bg-slate-950'}`}>🏠 Home</button>
                        <button onClick={() => setActiveTab('catalog')} className={`px-4 py-2 rounded-xl whitespace-nowrap transition-all ${activeTab === 'catalog' ? 'silver-gradient text-slate-950 font-black' : 'text-slate-300 bg-slate-950'}`}>🛍️ Catalog</button>
                        <button onClick={() => setActiveTab('builder')} className={`px-4 py-2 rounded-xl whitespace-nowrap transition-all ${activeTab === 'builder' ? 'silver-gradient text-slate-950 font-black' : 'text-slate-300 bg-slate-950'}`}>✨ Hamper Builder</button>
                        <button onClick={() => setActiveTab('booking')} className={`px-4 py-2 rounded-xl whitespace-nowrap transition-all ${activeTab === 'booking' ? 'silver-gradient text-slate-950 font-black' : 'text-slate-300 bg-slate-950'}`}>📅 Booking</button>
                        <button onClick={() => setActiveTab('specials')} className={`px-4 py-2 rounded-xl whitespace-nowrap transition-all ${activeTab === 'specials' ? 'silver-gradient text-slate-950 font-black' : 'text-slate-300 bg-slate-950'}`}>🔥 Specials</button>
                        <button onClick={() => { fetchOrders(); fetchBookings(); setActiveTab('orders'); }} className={`px-4 py-2 rounded-xl whitespace-nowrap transition-all ${activeTab === 'orders' ? 'silver-gradient text-slate-950 font-black' : 'text-slate-300 bg-slate-950'}`}>📦 Orders</button>
                        <button onClick={() => { fetchOrders(); fetchBookings(); setActiveTab('admin'); }} className={`px-4 py-2 rounded-xl whitespace-nowrap transition-all ${activeTab === 'admin' ? 'silver-gradient text-slate-950 font-black' : 'text-slate-300 bg-slate-950'}`}>🔐 Admin</button>
                    </div>

                    {/* Live Community Activity Bar */}
                    <div className="bg-slate-900/90 border-b silver-border text-slate-300 text-[11px] py-2 px-4 text-center font-medium overflow-hidden shadow-inner flex items-center justify-center space-x-2">
                        <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                        <span className="font-extrabold text-white">Live eNanda Feed:</span>
                        <span className="text-slate-300 animate-fade-in key={liveActivityIndex}">{REAL_WORLD_FEED[liveActivityIndex]}</span>
                    </div>

                    <main className="max-w-6xl mx-auto px-4 mt-8 space-y-10 animate-fade-in">
                        
                        {/* TAB 0: HOME PAGE */}
                        {activeTab === 'home' && (
                            <section className="space-y-10 animate-fade-in">
                                <div className="relative overflow-hidden rounded-3xl border silver-border p-8 sm:p-14 shadow-2xl bg-glass flex flex-col lg:flex-row items-center justify-between gap-10">
                                    <div className="absolute -right-20 -top-20 w-80 h-80 silver-gradient rounded-full blur-3xl opacity-20 pointer-events-none animate-glow"></div>

                                            <input type="tel" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} placeholder="Phone Number (e.g. 0625873479) *" className="px-3.5 py-2.5 rounded-xl bg-slate-950 border silver-border text-white outline-none focus:ring-2 focus:ring-slate-300 transition-all"/>
                                        </div>
                                        <input type="text" value={deliveryAddress} onChange={(e) => setDeliveryAddress(e.target.value)} placeholder="eNanda Sector / Street Address" className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border silver-border text-white outline-none focus:ring-2 focus:ring-slate-300 transition-all"/>

                                        {/* Payment Gateway Option */}
                                        <div className="space-y-2 pt-2 border-t silver-border">
                                            <span className="text-white font-extrabold block">💳 Select Payment Gateway:</span>
                                            <div className="grid grid-cols-3 gap-2">
                                                <button onClick={() => setPaymentMethod('COD')} className={`p-2.5 rounded-xl border text-[11px] font-bold text-center transition-all ${paymentMethod === 'COD' ? 'bg-emerald-600 text-white border-emerald-400 shadow-md' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>💵 Cash on Delivery</button>
                                                <button onClick={() => setPaymentMethod('CAPITEC_PAY')} className={`p-2.5 rounded-xl border text-[11px] font-bold text-center transition-all ${paymentMethod === 'CAPITEC_PAY' ? 'bg-blue-600 text-white border-blue-400 shadow-md' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>📲 Capitec Pay / EFT</button>
                                                <button onClick={() => setPaymentMethod('CARD_ONLINE')} className={`p-2.5 rounded-xl border text-[11px] font-bold text-center transition-all ${paymentMethod === 'CARD_ONLINE' ? 'bg-amber-600 text-white border-amber-400 shadow-md' : 'bg-slate-950 text-slate-400 border-slate-800'}`}>💳 Online Card</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="py-3 border-t silver-border flex space-x-2.5">
                                    <input type="text" value={promoCode} onChange={(e) => setPromoCode(e.target.value)} placeholder="Promo code (NOLLIE10)" className="flex-1 px-4 py-3 text-xs rounded-xl bg-slate-900 border silver-border text-white uppercase outline-none"/>
                                    <button onClick={applyPromo} className="press-effect silver-gradient text-slate-950 text-xs font-bold px-5 py-3 rounded-xl shadow">Apply</button>
                                </div>

                                <div className="border-t silver-border pt-4 space-y-2.5 text-xs">
                                    <div className="flex justify-between text-slate-300 font-medium"><span>Subtotal:</span><span>R {subtotal.toFixed(2)}</span></div>
                                    <div className="flex justify-between text-slate-300 font-medium"><span>Discount:</span><span className="text-emerald-400">-R {discount.toFixed(2)}</span></div>
                                    <div className="flex justify-between text-slate-300 font-medium"><span>Delivery Fee (eNanda):</span><span>R 30.00</span></div>
                                    <div className="flex justify-between text-lg font-black text-white pt-2 border-t silver-border"><span>Total Amount:</span><span className="silver-text">R {grandTotal.toFixed(2)}</span></div>
                                    <button onClick={handleCheckout} className="press-effect w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-4 rounded-2xl text-sm shadow-xl mt-2 flex items-center justify-center space-x-2 hover:scale-[1.01] transition-transform">
                                        <span>Pay R{grandTotal.toFixed(2)} & Submit Order 🚀</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Product Detail Modal */}
                    {activeModalProduct && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-glass rounded-3xl p-6 sm:p-8 border silver-border max-w-md w-full space-y-5 shadow-2xl">
                                <div className="flex justify-between items-center border-b silver-border pb-4">
                                    <h3 className="font-black text-base text-white">{activeModalProduct.title}</h3>
                                    <button onClick={() => setActiveModalProduct(null)} className="press-effect text-slate-400 text-xl font-bold bg-slate-800 w-9 h-9 rounded-full flex items-center justify-center hover:bg-slate-700">&times;</button>
                                </div>
                                <img src={activeModalProduct.img} alt="Product" className="w-full h-52 object-cover rounded-2xl bg-slate-900 border silver-border shadow-inner" onError={(e)=>{e.target.onerror=null; e.target.src=FALLBACK_SVG;}}/>
                                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed font-medium">{activeModalProduct.desc}</p>
                                <div className="flex justify-between items-center pt-4 border-t silver-border">
                                    <span className="text-xl font-black silver-text">R {activeModalProduct.price.toFixed(2)}</span>
                                    <button onClick={() => { addToCart(activeModalProduct.title, activeModalProduct.price); setActiveModalProduct(null); }} className="press-effect silver-gradient text-slate-950 font-extrabold px-6 py-3.5 rounded-2xl text-xs shadow-xl hover:scale-105 transition-transform">+ Add to Cart</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 bg-slate-900 border silver-border silver-gradient text-slate-950 text-xs font-black px-6 py-4 rounded-2xl shadow-2xl z-50 animate-fade-in">
                            {toastMessage}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
