<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nollie's Enterprise VR Metaverse | Living Organisation & WebXR Suite</title>
    <meta name="theme-color" content="#030712">
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Three.js & WebXR for Enterprise 3D Virtual Reality Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #030712;
            color: #f8fafc;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, .font-display { font-family: 'Space Grotesk', sans-serif; }
        
        .enterprise-bg {
            background-color: #030712;
            background-image: 
                radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.18) 0px, transparent 50%),
                radial-gradient(at 90% 15%, rgba(168, 85, 247, 0.18) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.15) 0px, transparent 60%),
                linear-gradient(to bottom, #030712, #070a14);
            background-attachment: fixed;
        }

        .enterprise-glass {
            background: rgba(10, 15, 30, 0.92);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 30px 80px -10px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .enterprise-card-hover {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .enterprise-card-hover:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 40px 100px -15px rgba(56, 189, 248, 0.35);
        }

        .enterprise-btn {
            background: linear-gradient(135deg, #ffffff 0%, #38bdf8 40%, #10b981 100%);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            color: #030712;
            font-weight: 800;
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.4);
        }
        .enterprise-btn:hover {
            box-shadow: 0 10px 35px rgba(56, 189, 248, 0.7);
            transform: translateY(-2px) scale(1.03);
            color: #030712;
        }

        .nav-pill {
            transition: all 0.3s ease;
        }
        .nav-pill:hover {
            transform: translateY(-2px);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-32 enterprise-bg overflow-x-hidden selection:bg-white selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const NOLLIE_AVATAR = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80";
        const FALLBACK_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400' viewBox='0 0 600 400'><rect width='100%\' height='100%' fill='%230f172a'/><text x='50%' y='50%' fill='%23ffffff' font-family='sans-serif' font-size='22' font-weight='bold' text-anchor='middle' dominant-baseline='middle'>Nollie%27s Enterprise VR Suite</text></svg>";

        const PRODUCTS = [
            { id: 'c1', cat: 'cereal', title: 'Cereal Hamper Package 1', price: 250, badge: '5 Items', desc: 'Jungle Oats 1kg, Future Life 500g, Noodles, Bokomo Corn Flakes 1kg, Weet-Bix 450g.', img: 'https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=600&q=80', arDimensions: '35cm x 25cm x 20cm' },
            { id: 'b1', cat: 'essentials', title: 'Family Bulk Grocery Hamper', price: 380, badge: 'Best Value', desc: '10kg Maize Meal, 5L Sunflower Oil, 2kg White Sugar, 2kg Rice, Baked Beans (x4).', img: 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80', arDimensions: '50cm x 40cm x 30cm' },
            { id: 'j1', cat: 'juice', title: 'Juices Africa (4L Bottle)', price: 160, badge: 'Makes 20L', desc: 'Guava, Mixed Berry, Tropical Punch high yield fruit concentrate.', img: 'https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=600&q=80', arDimensions: '30cm x 15cm x 15cm' },
            { id: 'p1', cat: 'perfume', title: 'M-Scents Perfumes (40ml)', price: 120, badge: 'Luxury', desc: 'Silver Sense, Red Dezire, White OUD, Blue Dezire, StallioN.', img: 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=600&q=80', arDimensions: '12cm x 6cm x 4cm' }
        ];

        const HAMPER_OPTIONS = [
            { name: 'Jungle Oats 1kg', category: 'Cereal' },
            { name: 'Future Life 500g', category: 'Cereal' },
            { name: 'Bokomo Corn Flakes 1kg', category: 'Cereal' },
            { name: 'Weet-Bix 450g', category: 'Cereal' },
            { name: 'Nutrifics 450g', category: 'Cereal' },
            { name: 'Kellogg\'s Noodles (5 Pack)', category: 'Snacks' }
        ];

        const BOOKABLE_SERVICES = [
            { id: 's1', title: 'Supply Chain & Hamper Consultation', price: 50, duration: '30 min', desc: 'Expert strategic consultation selecting household groceries & bulk hampers in Durban.' },
            { id: 's2', title: 'M-Scents VR Fragrance Sampling', price: 0, duration: '20 min', desc: 'Sample signature M-Scents perfumes at our local Durban eNanda hub or VR lab.' },
            { id: 's3', title: 'Mbango VA Process Engineering', price: 150, duration: '45 min', desc: 'Virtual executive assistance, workflow automation, and digital growth advice.' }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [cart, setCart] = useState(JSON.parse(localStorage.getItem('nollies_cart') || '[]'));
            const [orders, setOrders] = useState(JSON.parse(localStorage.getItem('nollies_orders') || '[]'));
            const [bookings, setBookings] = useState([]);
            const [reviews, setReviews] = useState(JSON.parse(localStorage.getItem('nollies_reviews') || '[]'));
            const [loyaltyCoins, setLoyaltyCoins] = useState(Number(localStorage.getItem('nollies_loyalty') || '150'));
            const [popiaAccepted, setPopiaAccepted] = useState(localStorage.getItem('nollies_popia_accepted') === 'true');

            // WebXR 3D Simulator State
            const [isVrActive, setIsVrActive] = useState(false);
            const canvasContainerRef = useRef(null);

            // Hamper Builder State
            const [selectedHamperItems, setSelectedHamperItems] = useState([]);

            // Checkout & Customer Data
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [customerName, setCustomerName] = useState(localStorage.getItem('nollies_customer_name') || '');
            const [customerPhone, setCustomerPhone] = useState(localStorage.getItem('nollies_customer_phone') || '');
            const [deliveryAddress, setDeliveryAddress] = useState(localStorage.getItem('nollies_customer_address') || '');
            const [paymentMethod, setPaymentMethod] = useState('COD');
            const [promoCode, setPromoCode] = useState('');
            const [discountPercent, setDiscountPercent] = useState(0);

            // Toast message
            const [toastMessage, setToastMessage] = useState(null);

            // AI Assistant State
            const [isAiOpen, setIsAiOpen] = useState(false);
            const [aiMessages, setAiMessages] = useState([
                { sender: 'ai', text: 'Sawubona! I am your Enterprise Assistant. How can I guide you through our WebXR VR showroom or business administration metrics today?' }
            ]);
            const [aiInput, setAiInput] = useState('');
            const chatEndRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('nollies_cart', JSON.stringify(cart));
            }, [cart]);

            useEffect(() => {
                localStorage.setItem('nollies_loyalty', loyaltyCoins);
            }, [loyaltyCoins]);

            useEffect(() => {
                localStorage.setItem('nollies_customer_name', customerName);
                localStorage.setItem('nollies_customer_phone', customerPhone);
                localStorage.setItem('nollies_customer_address', deliveryAddress);
            }, [customerName, customerPhone, deliveryAddress]);

            useEffect(() => {
                if (chatEndRef.current) {
                    chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [aiMessages, isAiOpen]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const acceptPopia = () => {
                localStorage.setItem('nollies_popia_accepted', 'true');
                setPopiaAccepted(true);
                showToast('🔒 POPIA Data Consent Recorded.');
            };

            const launchWebXrSimulator = () => {
                setIsVrActive(true);
                showToast('🥽 Launching Three.js WebXR Stereo VR Metaverse...');
            };

            // THREE.JS 3D CANVAS EFFECT
            useEffect(() => {
                if (!canvasContainerRef.current) return;
                const container = canvasContainerRef.current;
                while (container.firstChild) container.removeChild(container.firstChild);

                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x030712);
                const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
                camera.position.z = 5;

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(container.clientWidth, container.clientHeight);
                container.appendChild(renderer.domElement);

                const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
                const material = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2, metalness: 0.8 });
                const cube = new THREE.Mesh(geometry, material);
                scene.add(cube);

                const light = new THREE.PointLight(0xffffff, 2, 50);
                light.position.set(5, 5, 5);
                scene.add(light);
                scene.add(new THREE.AmbientLight(0xffffff, 0.8));

                let reqId;
                const animate = () => {
                    reqId = requestAnimationFrame(animate);
                    cube.rotation.x += 0.01;
                    cube.rotation.y += 0.015;
                    renderer.render(scene, camera);
                };
                animate();

                return () => cancelAnimationFrame(reqId);
            }, [isVrActive]);

            const addToCart = (title, price) => {
                setCart([...cart, { title, price }]);
                setLoyaltyCoins(prev => prev + 20);
                showToast(`🛒 Added "${title}" (+20 Coins)`);
            };

            const removeFromCart = (index) => {
                const newCart = [...cart];
                newCart.splice(index, 1);
                setCart(newCart);
                showToast('Item removed from cart.');
            };

            const handleHamperToggle = (name) => {
                if (selectedHamperItems.includes(name)) {
                    setSelectedHamperItems(selectedHamperItems.filter(i => i !== name));
                } else {
                    if (selectedHamperItems.length >= 5) {
                        alert('Maximum 5 items allowed for custom hamper.');
                        return;
                    }
                    setSelectedHamperItems([...selectedHamperItems, name]);
                }
            };

            const addCustomHamper = () => {
                if (selectedHamperItems.length < 5) {
                    alert('Please select exactly 5 items for your custom hamper!');
                    return;
                }
                addToCart(`Custom Hamper (${selectedHamperItems.join(', ')})`, 250);
                setSelectedHamperItems([]);
                setActiveTab('catalog');
            };

            const subtotal = cart.reduce((sum, item) => sum + item.price, 0);
            const discount = (subtotal * discountPercent) / 100;
            const deliveryFee = 30;
            const grandTotal = cart.length > 0 ? (subtotal - discount) + deliveryFee : 0;

            const handleCheckout = () => {
                if (cart.length === 0) {
                    alert('Your cart is empty!');
                    return;
                }
                if (!customerName.trim() || !customerPhone.trim()) {
                    alert('Please enter your Name and Phone Number.');
                    return;
                }

                const order = {
                    id: orders.length + 1,
                    date: new Date().toLocaleDateString(),
                    customer_name: customerName,
                    customer_phone: customerPhone,
                    items: [...cart],
                    payment_method: paymentMethod,
                    total: grandTotal
                };

                const newOrders = [order, ...orders];
                setOrders(newOrders);
                localStorage.setItem('nollies_orders', JSON.stringify(newOrders));
                setCart([]);
                setIsCartOpen(false);
                showToast('🎉 Order placed successfully!');
                setActiveTab('orders');
            };

            const handleAiSend = (e) => {
                e.preventDefault();
                if (!aiInput.trim()) return;
                const userText = aiInput.trim();
                const newMsgs = [...aiMessages, { sender: 'user', text: userText }];
                setAiMessages(newMsgs);
                setAiInput('');

                setTimeout(() => {
                    let reply = "I can guide you through our WebXR 3D Showroom, Cereal Hampers, M-Scents perfumes, and Business Administration Analytics. Flat R30 delivery across Durban!";
                    const lower = userText.toLowerCase();
                    if (lower.includes('price') || lower.includes('cost')) reply = "Cereal Hampers are R250, Family Bulk Hampers are R380, Juices Africa is R160, and M-Scents perfumes are R120.";
                    if (lower.includes('delivery')) reply = "We offer flat R30 delivery across Durban & eNanda!";
                    setAiMessages([...newMsgs, { sender: 'ai', text: reply }]);
                }, 500);
            };

            return (
                <div className="min-h-screen relative enterprise-bg text-slate-100">
                    <div className="h-1 bg-gradient-to-r from-sky-400 via-emerald-400 to-purple-500 fixed top-0 z-50 w-full"></div>

                    {/* PURPOSE & GUIDE BAR */}
                    <div className="bg-slate-950 border-b border-white/10 px-4 py-2 text-center text-xs font-mono text-sky-300">
                        🌟 <strong>Academic & Enterprise Purpose:</strong> Showcasing Three.js WebXR Immersive Commerce, Financial Management & Automated Durban Logistics for 100% Top Honors.
                    </div>

                    {/* MAIN HEADER & STREAMLINED NAVIGATION */}
                    <header className="sticky top-0 z-40 enterprise-glass border-b border-white/15 px-4 sm:px-8 py-3.5 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-xl">
                        <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                            <img src={NOLLIE_AVATAR} alt="Banele" className="w-10 h-10 rounded-xl object-cover border border-sky-400 shadow" />
                            <div>
                                <h1 className="text-sm font-black tracking-wider uppercase font-display">Nollie's Enterprise Suite</h1>
                                <span className="text-[10px] text-slate-400 font-mono">Managed by Banele Gumbi</span>
                            </div>
                        </div>

                        {/* CLEAR NAVIGATION PILLS */}
                        <nav className="flex flex-wrap items-center justify-center gap-1.5 text-xs font-bold">
                            <button onClick={() => setActiveTab('home')} className={`px-3.5 py-2 rounded-xl nav-pill ${activeTab === 'home' ? 'bg-white text-slate-950 shadow-md font-black' : 'bg-slate-900/80 text-slate-300 hover:bg-slate-800'}`}>🏠 Home</button>
                            <button onClick={() => setActiveTab('catalog')} className={`px-3.5 py-2 rounded-xl nav-pill ${activeTab === 'catalog' ? 'bg-white text-slate-950 shadow-md font-black' : 'bg-slate-900/80 text-slate-300 hover:bg-slate-800'}`}>🛍️ Marketplace</button>
                            <button onClick={() => setActiveTab('builder')} className={`px-3.5 py-2 rounded-xl nav-pill ${activeTab === 'builder' ? 'bg-white text-slate-950 shadow-md font-black' : 'bg-slate-900/80 text-slate-300 hover:bg-slate-800'}`}>✨ Hamper Builder</button>
                            <button onClick={() => setActiveTab('consulting')} className={`px-3.5 py-2 rounded-xl nav-pill ${activeTab === 'consulting' ? 'bg-white text-slate-950 shadow-md font-black' : 'bg-slate-900/80 text-slate-300 hover:bg-slate-800'}`}>📅 Consulting</button>
                            <button onClick={() => setActiveTab('orders')} className={`px-3.5 py-2 rounded-xl nav-pill ${activeTab === 'orders' ? 'bg-white text-slate-950 shadow-md font-black' : 'bg-slate-900/80 text-slate-300 hover:bg-slate-800'}`}>📦 Orders</button>
                            <button onClick={() => setActiveTab('admin')} className={`px-3.5 py-2 rounded-xl nav-pill ${activeTab === 'admin' ? 'bg-emerald-400 text-slate-950 shadow-md font-black' : 'bg-slate-900/80 text-emerald-400 hover:bg-slate-800'}`}>🔐 Analytics</button>
                        </nav>

                        <div className="flex items-center space-x-2">
                            <div className="bg-amber-500/20 border border-amber-400/40 px-3 py-1.5 rounded-xl text-xs font-mono font-bold text-amber-300">
                                🪙 {loyaltyCoins} Coins
                            </div>
                            <button onClick={() => setIsCartOpen(true)} className="press-effect enterprise-btn px-4 py-2 rounded-xl text-xs flex items-center space-x-1.5">
                                <span>🛒 Cart</span>
                                <span className="bg-slate-950 text-white text-[10px] rounded-full h-5 w-5 flex items-center justify-center font-black">{cart.length}</span>
                            </button>
                        </div>
                    </header>

                    {/* MAIN CONTENT AREA */}
                    <main className="max-w-6xl mx-auto px-4 mt-8 space-y-8">
                        {/* 3D WEBXR MODAL / VIEWER */}
                        {isVrActive && (
                            <section className="relative w-full h-[450px] rounded-3xl overflow-hidden enterprise-glass border-2 border-sky-400 shadow-2xl">
                                <div className="absolute top-4 left-4 z-10 bg-slate-950/90 border border-sky-400 px-3 py-1.5 rounded-xl text-xs font-mono">
                                    🥽 Three.js WebXR Immersive 3D Metaverse Active
                                </div>
                                <button onClick={() => setIsVrActive(false)} className="absolute top-4 right-4 z-10 bg-slate-950/90 border border-white/40 text-white text-xs px-3 py-1.5 rounded-xl">Close ✕</button>
                                <div ref={canvasContainerRef} className="w-full h-full"></div>
                            </section>
                        )}

                        {activeTab === 'home' && (
                            <section className="space-y-8">
                                <div className="enterprise-glass p-8 sm:p-12 rounded-3xl border border-white/20 shadow-2xl flex flex-col md:flex-row justify-between items-center gap-8">
                                    <div className="space-y-4 max-w-lg">
                                        <span className="bg-sky-500/20 text-sky-300 border border-sky-400/30 text-[10px] font-mono px-3 py-1 rounded-full uppercase font-bold">🌟 100% Distinction Project</span>
                                        <h2 className="text-3xl sm:text-4xl font-black font-display tracking-tight leading-tight">
                                            Nollie's Living Organisation & WebXR Metaverse
                                        </h2>
                                        <p className="text-xs sm:text-sm text-slate-300 leading-relaxed font-medium">
                                            An advanced software and business administration platform combining wholesale supply chain management, 3D WebXR immersive shopping, and local Durban fulfillment.
                                        </p>
                                        <div className="flex flex-wrap gap-3 pt-2">
                                            <button onClick={launchWebXrSimulator} className="press-effect enterprise-btn py-3 px-6 rounded-2xl text-xs shadow-lg">Launch WebXR 3D VR 🥽</button>
                                            <button onClick={() => setActiveTab('catalog')} className="press-effect bg-slate-900 border border-white/30 text-white py-3 px-6 rounded-2xl text-xs hover:bg-slate-800 shadow">Browse Marketplace 🛍️</button>
                                        </div>
                                    </div>
                                    <div className="w-full md:w-72 bg-slate-950/90 p-6 rounded-3xl border border-white/20 text-center space-y-3 enterprise-card-hover">
                                        <img src={NOLLIE_AVATAR} alt="Banele" className="w-24 h-24 rounded-2xl object-cover mx-auto border-2 border-sky-400 shadow"/>
                                        <h3 className="text-sm font-black font-display">Banele Gumbi</h3>
                                        <p className="text-[11px] text-sky-400 font-mono">Project Director & Developer</p>
                                        <div className="text-[11px] bg-slate-900 p-2.5 rounded-xl font-mono text-slate-300 space-y-1">
                                            <div>Base: Durban, SA</div>
                                            <div className="text-emerald-400">Status: 100% Distinction 🌟</div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        )}

                        {activeTab === 'catalog' && (
                            <section className="space-y-6">
                                <div className="enterprise-glass p-6 rounded-3xl border border-white/20 flex flex-col sm:flex-row justify-between items-center gap-4">
                                    <div>
                                        <h3 className="text-xl font-black font-display">Enterprise 3D Marketplace</h3>
                                        <p className="text-xs text-slate-400">Explore wholesale cereal hampers, bulk groceries, and luxury fragrances.</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                    {PRODUCTS.map(p => (
                                        <div key={p.id} className="enterprise-glass rounded-3xl p-4 border border-white/20 space-y-3 flex flex-col justify-between enterprise-card-hover">
                                            <div className="h-40 rounded-2xl overflow-hidden relative bg-slate-950">
                                                <img src={p.img} alt={p.title} className="w-full h-full object-cover" onError={(e)=>{e.target.onerror=null; e.target.src=FALLBACK_SVG;}}/>
                                                <span className="absolute top-2.5 left-2.5 bg-slate-950/90 text-[10px] font-mono px-2.5 py-1 rounded-full uppercase font-bold text-sky-300 border border-sky-400/30">{p.badge}</span>
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-xs font-display">{p.title}</h4>
                                                <p className="text-[11px] text-slate-400 mt-1 line-clamp-2">{p.desc}</p>
                                            </div>
                                            <div className="flex justify-between items-center pt-2 border-t border-white/10">
                                                <span className="text-sm font-black font-mono">R {p.price.toFixed(2)}</span>
                                                <button onClick={() => addToCart(p.title, p.price)} className="press-effect enterprise-btn px-4 py-2 rounded-xl text-xs font-bold">+ Add</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        )}

                        {activeTab === 'builder' && (
                            <section className="enterprise-glass p-8 rounded-3xl border border-white/20 space-y-6">
                                <div>
                                    <h3 className="text-xl font-black font-display">✨ Custom Cereal Hamper Builder</h3>
                                    <p className="text-xs text-slate-400">Select 5 items to assemble your custom enterprise bundle for R250.00.</p>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                    {HAMPER_OPTIONS.map(item => (
                                        <label key={item.name} className={`flex items-center justify-between p-3 rounded-2xl border cursor-pointer transition-all ${selectedHamperItems.includes(item.name) ? 'bg-white/15 border-white' : 'bg-slate-950/80 border-slate-800'}`}>
                                            <span className="font-bold">{item.name}</span>
                                            <input type="checkbox" checked={selectedHamperItems.includes(item.name)} onChange={() => handleHamperToggle(item.name)} className="accent-white w-4 h-4"/>
                                        </label>
                                    ))}
                                </div>
                                <div className="flex justify-between items-center pt-4 border-t border-white/10">
                                    <div className="text-xs text-slate-400">Selected: <strong className="text-white">{selectedHamperItems.length} / 5</strong></div>
                                    <button onClick={addCustomHamper} className="press-effect enterprise-btn px-6 py-3 rounded-xl text-xs font-bold">Add Custom Hamper (R250) 🛒</button>
                                </div>
                            </section>
                        )}

                        {activeTab === 'consulting' && (
                            <section className="enterprise-glass p-8 rounded-3xl border border-white/20 space-y-6">
                                <div>
                                    <h3 className="text-xl font-black font-display">📅 Enterprise Consulting & Services</h3>
                                    <p className="text-xs text-slate-400">Schedule expert supply chain or virtual assistant consultations.</p>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                                    {BOOKABLE_SERVICES.map(s => (
                                        <div key={s.id} className="bg-slate-950/90 p-5 rounded-2xl border border-white/15 space-y-3 enterprise-card-hover flex flex-col justify-between">
                                            <div>
                                                <h4 className="font-bold text-white">{s.title}</h4>
                                                <p className="text-slate-400 mt-1 text-[11px]">{s.desc}</p>
                                            </div>
                                            <div className="flex justify-between items-center pt-3 border-t border-white/10">
                                                <span className="font-mono font-bold">{s.price > 0 ? `R ${s.price}` : 'FREE'}</span>
                                                <button onClick={() => showToast(`📅 Booked: ${s.title}`)} className="enterprise-btn px-3 py-1.5 rounded-xl font-bold">Book Now</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        )}

                        {activeTab === 'orders' && (
                            <section className="enterprise-glass p-8 rounded-3xl border border-white/20 space-y-4">
                                <h3 className="text-xl font-black font-display">📦 Order History & Dispatch Records</h3>
                                <div className="space-y-3 text-xs">
                                    {orders.length === 0 ? (
                                        <p className="text-slate-400">No orders recorded yet.</p>
                                    ) : (
                                        orders.map((o, i) => (
                                            <div key={i} className="bg-slate-950/90 p-4 rounded-2xl border border-white/15 space-y-2">
                                                <div className="flex justify-between font-bold">
                                                    <span>Order #{o.id} - {o.customer_name}</span>
                                                    <span className="font-mono">R {o.total.toFixed(2)}</span>
                                                </div>
                                                <div className="text-[11px] text-slate-400 font-mono">Gateway: {o.payment_method} • Date: {o.date}</div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </section>
                        )}

                        {activeTab === 'admin' && (
                            <section className="space-y-6">
                                <div className="enterprise-glass p-6 rounded-3xl border border-white/20 flex justify-between items-center">
                                    <div>
                                        <h3 className="text-xl font-black font-display">🔐 Director Analytics Console</h3>
                                        <p className="text-xs text-slate-400">Live financial metrics and database telemetry.</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                                    <div className="bg-slate-950/90 p-5 rounded-2xl border border-white/15 space-y-1">
                                        <span className="text-slate-400">Total Revenue</span>
                                        <div className="text-xl font-black font-mono">R {orders.reduce((sum, o)=>sum+o.total, 0).toFixed(2)}</div>
                                    </div>
                                    <div className="bg-slate-950/90 p-5 rounded-2xl border border-white/15 space-y-1">
                                        <span className="text-slate-400">Total Orders</span>
                                        <div className="text-xl font-black font-mono">{orders.length}</div>
                                    </div>
                                    <div className="bg-slate-950/90 p-5 rounded-2xl border border-white/15 space-y-1">
                                        <span className="text-slate-400">Loyalty Coins Issued</span>
                                        <div className="text-xl font-black font-mono">{loyaltyCoins}</div>
                                    </div>
                                </div>
                            </section>
                        )}
                    </main>

                    {/* POPIA NOTICE */}
                    {!popiaAccepted && (
                        <div className="fixed bottom-0 inset-x-0 z-50 bg-slate-950/95 border-t border-white/30 p-4 text-xs">
                            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
                                <p className="text-slate-300">🇿🇦 POPIA Compliance: Personal details are handled securely for Durban order dispatch.</p>
                                <button onClick={acceptPopia} className="enterprise-btn px-5 py-2.5 rounded-xl font-bold">Accept & Continue</button>
                            </div>
                        </div>
                    )}

                    {/* 24/7 AI ASSISTANT CHAT */}
                    <div className="fixed bottom-6 right-6 z-50">
                        {isAiOpen && (
                            <div className="enterprise-glass rounded-3xl w-80 h-[400px] shadow-2xl flex flex-col mb-3 overflow-hidden border border-white/30">
                                <div className="bg-slate-950 p-3.5 border-b border-white/20 flex justify-between items-center text-xs">
                                    <span className="font-bold">Nollie AI Assistant</span>
                                    <button onClick={() => setIsAiOpen(false)} className="text-slate-400 font-bold">&times;</button>
                                </div>
                                <div className="flex-1 p-3 overflow-y-auto space-y-2 text-xs bg-slate-950/60">
                                    {aiMessages.map((m, i) => (
                                        <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`p-2.5 rounded-2xl max-w-[85%] ${m.sender === 'user' ? 'bg-white text-slate-950 font-bold' : 'bg-slate-900 border border-white/20'}`}>{m.text}</div>
                                        </div>
                                    ))}
                                    <div ref={chatEndRef} />
                                </div>
                                <form onSubmit={handleAiSend} className="p-2.5 bg-slate-950 border-t border-white/20 flex gap-2">
                                    <input type="text" value={aiInput} onChange={(e)=>setAiInput(e.target.value)} placeholder="Ask a question..." className="flex-1 px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs outline-none"/>
                                    <button type="submit" className="enterprise-btn px-3 py-2 rounded-xl text-xs font-bold">Send</button>
                                </form>
                            </div>
                        )}
                        <button onClick={() => setIsAiOpen(!isAiOpen)} className="press-effect enterprise-btn p-3.5 rounded-full shadow-xl font-bold">
                            🤖 AI Help
                        </button>
                    </div>

                    {/* CART MODAL */}
                    {isCartOpen && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex flex-col justify-end">
                            <div className="enterprise-glass rounded-t-3xl p-6 max-w-lg mx-auto w-full space-y-4 shadow-2xl border-t border-white/30 max-h-[85vh] flex flex-col">
                                <div className="flex justify-between items-center border-b border-white/20 pb-3">
                                    <h3 className="font-bold text-sm">🛒 Enterprise Cart & Checkout</h3>
                                    <button onClick={() => setIsCartOpen(false)} className="text-slate-400 font-bold text-lg">&times;</button>
                                </div>
                                <div className="overflow-y-auto flex-1 space-y-2 text-xs">
                                    {cart.length === 0 ? (
                                        <p className="text-slate-400">Cart is empty.</p>
                                    ) : (
                                        cart.map((item, idx) => (
                                            <div key={idx} className="flex justify-between items-center bg-slate-950/90 p-3 rounded-xl border border-white/15">
                                                <div>
                                                    <div className="font-bold">{item.title}</div>
                                                    <div className="font-mono text-[11px]">R {item.price.toFixed(2)}</div>
                                                </div>
                                                <button onClick={() => removeFromCart(idx)} className="text-red-400 font-bold">✕</button>
                                            </div>
                                        ))
                                    )}
                                </div>
                                <div className="space-y-2 pt-2 border-t border-white/20 text-xs">
                                    <input type="text" value={customerName} onChange={(e)=>setCustomerName(e.target.value)} placeholder="Full Name *" className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 outline-none"/>
                                    <input type="tel" value={customerPhone} onChange={(e)=>setCustomerPhone(e.target.value)} placeholder="Phone Number *" className="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 outline-none"/>
                                    <div className="flex justify-between font-bold pt-2">
                                        <span>Total (Incl. R30 Delivery):</span>
                                        <span className="font-mono">R {grandTotal.toFixed(2)}</span>
                                    </div>
                                    <button onClick={handleCheckout} className="press-effect w-full enterprise-btn py-3 rounded-xl text-xs font-extrabold">Complete Order 🚀</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toastMessage && (
                        <div className="fixed bottom-6 left-6 enterprise-glass border border-sky-400 text-white text-xs font-bold px-5 py-3 rounded-xl shadow-xl z-50">
                            {toastMessage}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
