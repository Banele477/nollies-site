<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nqobile's | Exhilarating 2026 Raindrop 3D Durban Hub</title>
    <meta name="theme-color" content="#030712">
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #030712;
            color: #f8fafc;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, .font-display { font-family: 'Space Grotesk', sans-serif; }
        
        .white-rainbow-bg {
            background-color: #030712;
            background-image: 
                radial-gradient(at 15% 15%, rgba(255, 255, 255, 0.22) 0px, transparent 50%),
                radial-gradient(at 85% 20%, rgba(239, 68, 68, 0.2) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(255, 255, 255, 0.28) 0px, transparent 60%),
                radial-gradient(at 20% 85%, rgba(59, 130, 246, 0.2) 0px, transparent 50%),
                radial-gradient(at 85% 85%, rgba(168, 85, 247, 0.2) 0px, transparent 50%),
                linear-gradient(to bottom, #030712, #0b0f19);
            background-attachment: fixed;
        }

        .rainbow-glass {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(35px) saturate(200%);
            -webkit-backdrop-filter: blur(35px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 35px 80px -15px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .rainbow-card-hover {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .rainbow-card-hover:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.75);
            box-shadow: 0 40px 90px -15px rgba(255, 255, 255, 0.4);
        }

        @keyframes whiteRainbowText {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .white-rainbow-animated-text {
            background: linear-gradient(135deg, #ffffff, #f43f5e, #fbbf24, #34d399, #38bdf8, #a855f7, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: whiteRainbowText 6s linear infinite;
        }

        .white-rainbow-btn {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 20%, #ef4444 40%, #10b981 60%, #0ea5e9 80%, #a855f7 100%);
            background-size: 250% auto;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            color: #030712;
            font-weight: 900;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.4);
        }
        .white-rainbow-btn:hover {
            background-position: right center;
            box-shadow: 0 8px 35px rgba(255, 255, 255, 0.8);
            transform: translateY(-2px) scale(1.03);
            color: #ffffff;
        }

        .raindrop-pill {
            position: relative;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(15, 23, 42, 0.92));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.8), inset 0 2px 5px rgba(255, 255, 255, 0.5);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        .raindrop-pill::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 25%;
            width: 40%;
            height: 4px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 999px;
        }
        .raindrop-pill:hover {
            transform: translateY(-5px) scale(1.08);
            border-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 45px rgba(255, 255, 255, 0.4), inset 0 2px 8px rgba(255, 255, 255, 0.9);
        }
        .raindrop-active {
            background: linear-gradient(135deg, #ffffff 0%, #f43f5e 30%, #38bdf8 70%, #a855f7 100%);
            color: #030712 !important;
            font-weight: 900;
            border: 1px solid #ffffff;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.9), inset 0 2px 8px rgba(255, 255, 255, 1);
            transform: scale(1.1) translateY(-3px);
        }

        .marquee-container { overflow: hidden; white-space: nowrap; position: relative; width: 100%; }
        .marquee-track { display: inline-block; animation: marqueeScroll 20s linear infinite; }
        .marquee-track:hover { animation-play-state: paused; }
        @keyframes marqueeScroll { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-32 white-rainbow-bg overflow-x-hidden selection:bg-white selection:text-slate-950">

        const PROMO_FLYERS = [

            { id: 'fl2', title: 'Bulk Packed Wholesale Hamper Box', badge: 'Top Seller', price: 'R380.00', desc: 'Securely packaged family grocery boxes ready for immediate Durban doorstep dispatch.', img: '/images/1000040067_2.jpg', tag: 'BULK ESSENTIALS' },

            { id: 'c2', cat: 'cereal', title: 'Cereal Hamper Package 2 (Studio Layout)', price: 250, badge: '5 Items', desc: 'Nutrific Super Mornings, Jungle Oats, Weet-Bix, Corn Flakes & Tropika Dairy Fruit Mix.', img: '/images/1000040076_2.jpg', arDimensions: '35cm x 25cm x 20cm (Box)' },

            { id: 2, name: 'Sthelo Mkhize', rating: 5, comment: 'M-Scents Selver Sense and White OUD smell incredible and last all day. Super professional!', date: '10 October 2026', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=100&q=75' }

            "🚀 FAST DISPATCH: Flat R30 Delivery Across Durban & eNanda!",

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [isMasterMenuOpen, setIsMasterMenuOpen] = useState(false);
            const [cart, setCart] = useState(JSON.parse(localStorage.getItem('nollies_cart') || '[]'));
            const [orders, setOrders] = useState([]);

            const [popiaAccepted, setPopiaAccepted] = useState(localStorage.getItem('nollies_popia_accepted') === 'true');
            const [loyaltyCoins, setLoyaltyCoins] = useState(Number(localStorage.getItem('nollies_loyalty') || '150'));

            const [arProduct, setArProduct] = useState(null);
            const [arZoom, setArZoom] = useState(1);
            const [arRotation, setArRotation] = useState(0);

            const [activePoster, setActivePoster] = useState(null);
            const [communityPosts, setCommunityPosts] = useState(JSON.parse(localStorage.getItem('nollies_community') || JSON.stringify([

            const [newPostAuthor, setNewPostAuthor] = useState('');
            const [newPostMsg, setNewPostMsg] = useState('');

            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [promoCode, setPromoCode] = useState('');
            const [discountPercent, setDiscountPercent] = useState(0);
            const [selectedHamperItems, setSelectedHamperItems] = useState([]);
            const [activeModalProduct, setActiveModalProduct] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            const [customerName, setCustomerName] = useState(localStorage.getItem('nollies_customer_name') || '');
            const [customerPhone, setCustomerPhone] = useState(localStorage.getItem('nollies_customer_phone') || '');
            const [deliveryAddress, setDeliveryAddress] = useState(localStorage.getItem('nollies_customer_address') || '');
            const [paymentMethod, setPaymentMethod] = useState('COD'); 

            const [bookingService, setBookingService] = useState('Doorstep Hamper Consultation & Delivery');
            const [bookingDate, setBookingDate] = useState('2026-10-22');
            const [bookingTime, setBookingTime] = useState('10:00 AM');

            const [newReviewName, setNewReviewName] = useState('');
            const [newReviewRating, setNewReviewRating] = useState('5');
            const [newReviewComment, setNewReviewComment] = useState('');

            const [isAiOpen, setIsAiOpen] = useState(false);
            const [aiMessages, setAiMessages] = useState([
                { sender: 'ai', text: 'Sawubona! I am Nqobile AI Assistant for nqobilegila518@gmail.com. How can I assist you with your order today?' }
            ]);
            const [aiInput, setAiInput] = useState('');
            const chatEndRef = useRef(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 2500);
            };

            const acceptPopia = () => {
                localStorage.setItem('nollies_popia_accepted', 'true');
                setPopiaAccepted(true);
                showToast('🔒 POPIA Consent Recorded.');
            };

            const downloadDirectApk = () => {
                showToast('✨ Downloading Android APK...');
                const a = document.createElement('a');
                a.href = '/downloads/nollies.apk';
                a.download = 'NqobilesHub.apk';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            useEffect(() => {
                localStorage.setItem('nollies_cart', JSON.stringify(cart));
            }, [cart]);

            const addToCart = (title, price) => {
                setCart([...cart, { title, price }]);
                setLoyaltyCoins(prev => prev + 20);
                showToast(`🛒 ${title} added (+20 Coins)`);
            };

            const removeFromCart = (index) => {
                const newCart = [...cart];
                newCart.splice(index, 1);
                setCart(newCart);
                showToast('Item removed.');
            };

            const handleHamperToggle = (name) => {
                if (selectedHamperItems.includes(name)) {
                    setSelectedHamperItems(selectedHamperItems.filter(i => i !== name));
                } else {
                    if (selectedHamperItems.length >= 5) {
                        alert('Maximum 5 items allowed for custom hampling.');
                        return;
                    }
                    setSelectedHamperItems([...selectedHamperItems, name]);
                }
            };

            const addCustomHamper = () => {
                if (selectedHamperItems.length < 5) {
                    alert('Please select exactly 5 items to assemble your custom bundle!');
                    return;
                }
                addToCart(`Custom Cereal Hamper (${selectedHamperItems.join(', ')})`, 250);
                setSelectedHamperItems([]);
                setActiveTab('catalog');

                if (promoCode.trim().toUpperCase() === 'NOLLIE10') {
                    setDiscountPercent(10);
                    showToast('🎉 10% Discount Applied!');
                } else {
                    alert('Invalid promo code!');

                e.preventDefault();
                if (!newReviewName.trim() || !newReviewComment.trim()) return;
                const newRev = {
                    id: reviews.length + 1,
                    name: newReviewName,
                    rating: Number(newReviewRating),
                    comment: newReviewComment,
                    date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
                    avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=75'

                setReviews([newRev, ...reviews]);
                setNewReviewName('');
                setNewReviewComment('');
                setLoyaltyCoins(prev => prev + 35);
                showToast('⭐ Review published! (+35 Bonus Coins)');

            const handleAddCommunityPost = (e) => {
                e.preventDefault();
                if (!newPostAuthor.trim() || !newPostMsg.trim()) return;
                const post = {
                    id: communityPosts.length + 1,
                    author: newPostAuthor,
                    msg: newPostMsg,
                    time: 'Just now',
                    avatar: 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?auto=format&fit=crop&w=100&q=75'
                };
                setCommunityPosts([post, ...communityPosts]);
                setNewPostAuthor('');
                setNewPostMsg('');
                showToast('💬 Posted to Board!');

                if (cart.length === 0) {
                    alert('Your cart is empty!');
                    return;
                }
                let text = `Sawubona Nqobile's Hub (nqobilegila518@gmail.com)! Order:%0A`;
                cart.forEach(i => text += `• ${i.title} - R${i.price}%0A`);
                window.open(`https://wa.me/27637019808?text=${text}`, '_blank');
            };

            const discount = (subtotal * discountPercent) / 100;
            const deliveryFee = 30;
            const grandTotal = cart.length > 0 ? (subtotal - discount) + deliveryFee : 0;

                if (cart.length === 0) return;
                if (!customerName.trim() || !customerPhone.trim()) {
                    alert('Please provide Full Name and Phone Number.');
                    return;
                }

                            </div>

                        <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('home')}>

                                </h1>

                            </div>
                        </div>
                        
                        <div className="relative">
                            <button onClick={() => setIsMasterMenuOpen(!isMasterMenuOpen)} 
                                    className="press-effect raindrop-pill raindrop-active px-8 py-4 text-xs font-black flex items-center space-x-3 shadow-2xl">
                                <span className="text-base">💧</span>
                                <span className="tracking-wider">MENU: {currentActiveTabObj.label}</span>
                                <span>▼</span>
                            </button>

                            {isMasterMenuOpen && (
                                <div className="absolute right-0 mt-3 w-80 sm:w-96 rainbow-glass rounded-3xl border border-white/40 p-4 shadow-2xl z-50 space-y-2">
                                    <div className="px-3 py-2 border-b border-white/20 flex justify-between items-center">
                                        <span className="text-[10px] font-mono font-bold text-sky-300 uppercase">Select Hub Section</span>

                                    <img src={activePoster.img} alt={activePoster.title} loading="lazy" className="w-full h-full object-cover" onError={(e)=>{e.target.onerror=null; e.target.src=FALLBACK_SVG;}}/>
                                </div>
                                <button onClick={() => { addToCart(activePoster.title, 250); setActivePoster(null); }} className="w-full white-rainbow-btn text-slate-950 font-extrabold py-3 rounded-2xl text-xs shadow-xl">Order Package 🛒</button>
                            </div>
                        </div>
                    )}

                    {!popiaAccepted && (
                        <div className="fixed bottom-0 inset-x-0 z-50 bg-slate-950/95 border-t border-white/30 p-4 shadow-2xl">
                            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 text-xs">
                                <p className="text-slate-300">Nqobile's Hub (nqobilegila518@gmail.com) processes personal data securely under POPIA.</p>
                                <button onClick={acceptPopia} className="white-rainbow-btn text-slate-950 text-xs font-black px-6 py-3 rounded-xl shadow-lg">Accept & Continue 🔒</button>
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-6 right-6 z-50 flex flex-col items-end">
                        {isAiOpen && (
                            <div className="rainbow-glass border border-white/40 rounded-3xl w-80 sm:w-96 h-[450px] shadow-2xl flex flex-col mb-4 overflow-hidden">
                                <div className="bg-slate-950/95 p-4 border-b border-white/25 flex justify-between items-center">
                                    <h4 className="text-xs font-black text-white font-display uppercase">Nqobile AI Assistant</h4>
                                    <button onClick={() => setIsAiOpen(false)} className="text-slate-400 text-lg font-bold">&times;</button>
                                </div>
                                <div className="flex-1 p-4 overflow-y-auto space-y-3 text-xs bg-slate-950/60">
                                    {aiMessages.map((msg, i) => (
                                        <div key={i} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[80%] p-3 rounded-2xl ${msg.sender === 'user' ? 'bg-white text-slate-950 font-bold shadow-md' : 'bg-slate-900 text-slate-200 border border-white/20 shadow-sm'}`}>{msg.text}</div>
                                        </div>
                                    ))}
                                    <div ref={chatEndRef} />
                                </div>
                                <form onSubmit={(e)=>{e.preventDefault(); if(!aiInput.trim())return; setAiMessages([...aiMessages, {sender:'user', text:aiInput}, {sender:'ai', text:'Sawubona! Nqobile\'s team is ready to assist.'}]); setAiInput('');}} className="p-3 bg-slate-950/95 border-t border-white/25 flex gap-2">
                                    <input type="text" value={aiInput} onChange={(e) => setAiInput(e.target.value)} placeholder="Ask..." className="flex-1 px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs outline-none"/>
                                    <button type="submit" className="white-rainbow-btn px-4 py-2.5 rounded-xl text-xs font-black shadow">Send</button>
                                </form>
                            </div>
                        )}
                        <button onClick={() => setIsAiOpen(!isAiOpen)} className="white-rainbow-btn p-4 rounded-full shadow-2xl text-slate-950 font-black text-xl">💧</button>
                    </div>

                    {isCartOpen && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex flex-col justify-end">
                            <div className="rainbow-glass rounded-t-3xl p-6 sm:p-8 border-t border-white/30 max-h-[90vh] flex flex-col shadow-2xl max-w-2xl mx-auto w-full">
                                <div className="flex justify-between items-center border-b border-white/20 pb-4">
                                    <h3 className="font-black text-base text-white font-display">🛒 Secure Cart & Checkout</h3>
                                    <button onClick={() => setIsCartOpen(false)} className="text-slate-400 text-xl font-bold">&times;</button>
                                </div>
                                <div className="py-4 overflow-y-auto flex-1 space-y-4 text-xs">
                                    <div className="space-y-2">
                                        <div className="flex justify-between items-center">
                                            <span className="text-slate-400 font-bold uppercase text-[10px] font-mono">Cart Items:</span>
                                            <button onClick={shareCartToWhatsApp} className="bg-emerald-600/30 border border-emerald-500/50 text-emerald-300 text-[10px] font-bold px-3 py-1 rounded-xl shadow">Share to WhatsApp 📲</button>
                                        </div>
                                        {cart.map((item, idx) => (
                                            <div key={idx} className="flex justify-between items-center bg-slate-950/90 p-3 rounded-2xl border border-white/20 text-slate-200">
                                                <div><div className="font-extrabold text-white">{item.title}</div><div className="text-white font-mono text-[11px]">R {item.price.toFixed(2)}</div></div>
                                                <button onClick={() => removeFromCart(idx)} className="text-red-400 font-bold">✕</button>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="space-y-2 pt-2">
                                        <input type="text" value={customerName} onChange={(e) => setCustomerName(e.target.value)} placeholder="Full Name *" className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs outline-none"/>
                                        <input type="tel" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} placeholder="Phone Number *" className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs outline-none"/>
                                    </div>
                                </div>
                                <div className="border-t border-white/20 pt-4 space-y-2.5 text-xs">
                                    <div className="flex justify-between text-lg font-black text-white"><span>Total:</span><span className="text-white font-mono">R {grandTotal.toFixed(2)}</span></div>
                                    <button onClick={handleCheckout} className="w-full white-rainbow-btn text-slate-950 font-extrabold py-4 rounded-2xl text-sm shadow-xl">Pay R{grandTotal.toFixed(2)} & Complete Order 🚀</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeModalProduct && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="rainbow-glass rounded-3xl p-6 sm:p-8 border border-white/40 max-w-md w-full space-y-5 shadow-2xl">
                                <div className="flex justify-between items-center border-b border-white/20 pb-4">
                                    <h3 className="text-base font-black text-white font-display">{activeModalProduct.title}</h3>
                                    <button onClick={() => setActiveModalProduct(null)} className="text-slate-400 text-xl font-bold">&times;</button>
                                </div>
                                <img src={activeModalProduct.img} alt="Product" loading="lazy" className="w-full h-52 object-cover rounded-2xl bg-slate-900 border border-slate-800" onError={(e)=>{e.target.onerror=null; e.target.src=FALLBACK_SVG;}}/>
                                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed font-medium">{activeModalProduct.desc}</p>
                                <button onClick={() => { addToCart(activeModalProduct.title, activeModalProduct.price); setActiveModalProduct(null); }} className="w-full white-rainbow-btn text-slate-950 font-extrabold px-5 py-3 rounded-2xl text-xs shadow-xl">+ Add to Cart</button>
                            </div>
                        </div>
                    )}

                    {toastMessage && (
                        <div className="fixed bottom-6 left-6 rainbow-glass border border-red-400 text-white text-xs font-black px-6 py-4 rounded-2xl shadow-xl z-50 font-mono">
                            {toastMessage}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
<script src="photos.js?v=1792346322"></script>
<script src="catalog.js?v=1792346322" defer></script>
</body>
</html>
