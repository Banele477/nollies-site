<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nollie's | eNanda Premier Hub & Durban Marketplace</title>
    <meta name="theme-color" content="#030712">
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #030712;
            color: #f8fafc;
        }
        h1, h2, h3, h4, .font-display { font-family: 'Space Grotesk', sans-serif; }
        
        .white-rainbow-bg {
            background-color: #030712;
            background-image: 
                radial-gradient(at 15% 15%, rgba(255, 255, 255, 0.13) 0px, transparent 50%),
                radial-gradient(at 85% 20%, rgba(239, 68, 68, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(255, 255, 255, 0.15) 0px, transparent 60%),
                radial-gradient(at 20% 85%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 85% 85%, rgba(168, 85, 247, 0.12) 0px, transparent 50%),
                linear-gradient(to bottom, #030712, #0b0f19);
            background-attachment: fixed;
        }

        .rainbow-glass {
            background: rgba(15, 23, 42, 0.84);
            backdrop-filter: blur(32px) saturate(220%);
            -webkit-backdrop-filter: blur(32px) saturate(220%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .rainbow-card-hover {
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .rainbow-card-hover:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 30px 70px -12px rgba(255, 255, 255, 0.25);
        }

        @keyframes whiteRainbowText {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .white-rainbow-animated-text {
            background: linear-gradient(135deg, #ffffff, #f43f5e, #fbbf24, #34d399, #38bdf8, #a855f7, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: whiteRainbowText 7s linear infinite;
        }

        .white-rainbow-btn {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 20%, #ef4444 40%, #10b981 60%, #0ea5e9 80%, #a855f7 100%);
            background-size: 250% auto;
            transition: all 0.4s ease;
            color: #030712;
            font-weight: 900;
            box-shadow: 0 4px 25px rgba(255, 255, 255, 0.35);
        }
        .white-rainbow-btn:hover {
            background-position: right center;
            box-shadow: 0 6px 35px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
            color: #ffffff;
        }

        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            width: 100%;
        }
        .marquee-track {
            display: inline-block;
            animation: marqueeScroll 25s linear infinite;
        }
        .marquee-track:hover {
            animation-play-state: paused;
        }
        @keyframes marqueeScroll {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-32 white-rainbow-bg overflow-x-hidden selection:bg-white selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const NOLLIE_AVATAR = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80";
        const FALLBACK_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400' viewBox='0 0 600 400'><rect width='100%' height='100%' fill='%230f172a'/><text x='50%' y='50%' fill='%23ffffff' font-family='sans-serif' font-size='22' font-weight='bold' text-anchor='middle' dominant-baseline='middle'>Nollie%27s Dynamic Hub</text></svg>";

        const PRODUCTS = [
            { id: 'c1', cat: 'cereal', title: 'Cereal Hamper Package 1', price: 250, badge: '5 Items', desc: 'Jungle Oats 1kg, Future Life 500g, Noodles, Bokomo Corn Flakes 1kg, Weet-Bix 450g.', img: 'https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=600&q=80' },
            { id: 'c2', cat: 'cereal', title: 'Cereal Hamper Package 2', price: 250, badge: '5 Items', desc: 'Bokomo Corn Flakes 1kg, Rice Puffs, Juice, Porridge, Noodles.', img: 'https://images.unsplash.com/photo-1517093788734-90fa7b733160?auto=format&fit=crop&w=800&q=80' },
            { id: 'c3', cat: 'cereal', title: 'Cereal Hamper Package 3', price: 250, badge: '5 Items', desc: 'Bokomo Weet-Bix 450g, Corn Flakes 1kg, Future Life 500g, Nutrifics 450g, Noodles.', img: 'https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=600&q=80' },
            { id: 'b1', cat: 'essentials', title: 'Family Bulk Grocery Hamper', price: 380, badge: 'Best Value', desc: '10kg Maize Meal, 5L Sunflower Oil, 2kg White Sugar, 2kg Rice, 410g Baked Beans (x4).', img: 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80' },
            { id: 'b2', cat: 'essentials', title: 'Weekend Braai & Pap Combo', price: 295, badge: 'Weekend Special', desc: '5kg Iwisa Maize Meal, Braai Spice, Chakalaka (x3), Tomato & Onion Mix, 2L Soft Drink.', img: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80' },
            { id: 'j1', cat: 'juice', title: 'Juices Africa (4L Bottle)', price: 160, badge: 'Makes 20L', desc: 'Guava, Mixed Berry, Tropical Punch high yield fruit concentrate.', img: 'https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=600&q=80' },
            { id: 'p1', cat: 'perfume', title: 'M-Scents Perfumes (40ml)', price: 120, badge: '40ml Luxury', desc: 'Silver Sense, Red Dezire, White OUD, Blue Dezire, StallioN.', img: 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=600&q=80' },
            { id: 'p2', cat: 'perfume', title: 'M-Scents Duo Gift Set (2x 40ml)', price: 192, badge: 'Save R48', desc: 'Choose any two signature 40ml luxury fragrances in a gift presentation box.', img: 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=600&q=80' },
            { id: 'e1', cat: 'essentials', title: 'Fresh Bakery Daily Pack', price: 35, badge: 'Fresh Daily', desc: 'Fresh loaf, rolls, and morning treats.', img: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80' },
            { id: 'e3', cat: 'essentials', title: 'Cleaning & Hygiene Household Bucket', price: 185, badge: 'Home Care', desc: 'Dishwashing Liquid, Bleach, Washing Powder (2kg), and Floor Cleaner.', img: 'https://images.unsplash.com/photo-1585421514284-efb74c2b69ba?auto=format&fit=crop&w=600&q=80' }
        ];

        const HAMPER_OPTIONS = [
            { name: 'Jungle Oats 1kg', category: 'Cereal' },
            { name: 'Future Life 500g', category: 'Cereal' },
            { name: 'Bokomo Corn Flakes 1kg', category: 'Cereal' },
            { name: 'Weet-Bix 450g', category: 'Cereal' },
            { name: 'Nutrifics 450g', category: 'Cereal' },
            { name: 'Happy Valley Rice Puffs', category: 'Cereal' },
            { name: 'Kellogg\'s Noodles (5 Pack)', category: 'Snacks' },
            { name: 'Juice Concentrate 300ml', category: 'Beverage' }
        ];

        const BOOKABLE_SERVICES = [
            { id: 's1', title: 'Doorstep Hamper Consultation & Delivery', price: 50, duration: '30 min', desc: 'In-person assistance selecting household groceries & bulk hampers in eNanda & Durban.' },
            { id: 's2', title: 'M-Scents Fragrance Sampling Session', price: 0, duration: '20 min', desc: 'Sample signature M-Scents perfumes at our local eNanda hub point.' },
            { id: 's3', title: 'Mbango VA Admin & Business Support', price: 150, duration: '45 min', desc: 'Virtual assistance, administrative support, document preparation, & digital advice.' }
        ];

        const INITIAL_REVIEWS = [
            { id: 1, name: 'Snerh Dlamini', rating: 5, comment: 'The Family Bulk Grocery Hamper saved our month! Delivered right on time in eNanda. Excellent service!', date: '2 October 2026' },
            { id: 2, name: 'Sthelo Mkhize', rating: 5, comment: 'M-Scents perfumes smell incredible and last all day. Super professional delivery across Durban.', date: '10 October 2026' },
            { id: 3, name: 'Ayanda Msomi', rating: 5, comment: 'Custom Cereal Hamper builder is such a brilliant feature! Got all my favorite breakfast items instantly.', date: '14 October 2026' }
        ];

        const LIVE_TICKER_ITEMS = [
            "🏆 UNDISPUTED #1 HUB: AI Smart Matcher & Live Durban Weather Active!",
            "🔥 HOT DEAL: Family Bulk Grocery Hamper (R380) - Best Seller in eNanda!",
            "🤖 24/7 AI ASSISTANT ONLINE: Tap bottom-right to ask Nollie AI anything!",
            "🚀 FAST DISPATCH: Flat R30 Delivery Across Durban & eNanda!",
            "💧 JUICES AFRICA: 4L High-Yield Concentrates Making 20L Juice!",
            "💎 M-SCENTS: Luxury 40ml Fragrances Available Now in Durban!"
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [cart, setCart] = useState(JSON.parse(localStorage.getItem('nollies_cart') || '[]'));
            const [orders, setOrders] = useState([]);
            const [bookings, setBookings] = useState([]);
            const [reviews, setReviews] = useState(JSON.parse(localStorage.getItem('nollies_reviews') || JSON.stringify(INITIAL_REVIEWS)));
            
            // AI Smart Matcher State
            const [matchBudget, setMatchBudget] = useState('300');
            const [matchCategory, setMatchCategory] = useState('cereal');
            const [matchedResult, setMatchedResult] = useState(null);

            // Community Board State
            const [communityPosts, setCommunityPosts] = useState(JSON.parse(localStorage.getItem('nollies_community') || JSON.stringify([
                { id: 1, author: 'Banele Gumbi', msg: 'Welcome to Nollie\'s Durban Hub! Drop your neighborhood requests here.', time: 'Today' }
            ])));
            const [newPostAuthor, setNewPostAuthor] = useState('');
            const [newPostMsg, setNewPostMsg] = useState('');

            // Flash Deal Countdown Timer (4 Hours)
            const [timeLeft, setTimeLeft] = useState(14400);

            const [selectedCategory, setSelectedCategory] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [promoCode, setPromoCode] = useState('');
            const [discountPercent, setDiscountPercent] = useState(0);
            const [selectedHamperItems, setSelectedHamperItems] = useState([]);
            const [activeModalProduct, setActiveModalProduct] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            const [dynamicGreeting, setDynamicGreeting] = useState("Sawubona, Mzansi!");
            const [quickTrackId, setQuickTrackId] = useState('');
            const [trackResult, setTrackResult] = useState(null);

            const [isAiOpen, setIsAiOpen] = useState(false);
            const [aiMessages, setAiMessages] = useState([
                { sender: 'ai', text: 'Sawubona! I am Nollie AI, your 24/7 Durban Hub assistant. How can I help you with our hampers, perfumes, or deliveries today?' }
            ]);
            const [aiInput, setAiInput] = useState('');
            const chatEndRef = useRef(null);

            const [customerName, setCustomerName] = useState(localStorage.getItem('nollies_customer_name') || '');
            const [customerPhone, setCustomerPhone] = useState(localStorage.getItem('nollies_customer_phone') || '');
            const [commPreference, setCommPreference] = useState('whatsapp');
            const [deliveryAddress, setDeliveryAddress] = useState(localStorage.getItem('nollies_customer_address') || '');
            const [paymentMethod, setPaymentMethod] = useState('COD'); 

            const [bookingService, setBookingService] = useState('Doorstep Hamper Consultation & Delivery');
            const [bookingDate, setBookingDate] = useState('2026-10-20');
            const [bookingTime, setBookingTime] = useState('10:00 AM');
            const [bookingNotes, setBookingNotes] = useState('');

            // Review Form State
            const [newReviewName, setNewReviewName] = useState('');
            const [newReviewRating, setNewReviewRating] = useState('5');
            const [newReviewComment, setNewReviewComment] = useState('');

            // Questionnaire Form State
            const [q1, setQ1] = useState('Cereal Hampers');
            const [q2, setQ2] = useState('WhatsApp');
            const [q3, setQ3] = useState('Extremely Satisfied');
            const [questionnaireSubmitted, setQuestionnaireSubmitted] = useState(false);

            useEffect(() => {
                const timer = setInterval(() => {
                    setTimeLeft(prev => (prev > 0 ? prev - 1 : 14400));
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            };

            const runAiMatcher = () => {
                const budgetNum = Number(matchBudget);
                const filtered = PRODUCTS.filter(p => p.price <= budgetNum && (matchCategory === 'all' || p.cat === matchCategory));
                if (filtered.length > 0) {
                    const best = filtered[Math.floor(Math.random() * filtered.length)];
                    setMatchedResult(best);
                    showToast(`🤖 AI Recommendation found: ${best.title}!`);
                } else {
                    setMatchedResult(null);
                    alert('No products found within that exact budget and category. Try adjusting your budget!');
                }
            };

            const downloadDirectApk = () => {
                showToast('✨ Downloading Nollie\'s White-Rainbow Android APK...');
                const a = document.createElement('a');
                a.href = '/downloads/nollies.apk';
                a.download = 'NolliesHub.apk';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            useEffect(() => {
                localStorage.setItem('nollies_cart', JSON.stringify(cart));
            }, [cart]);

            useEffect(() => {
                localStorage.setItem('nollies_reviews', JSON.stringify(reviews));
            }, [reviews]);

            useEffect(() => {
                localStorage.setItem('nollies_community', JSON.stringify(communityPosts));
            }, [communityPosts]);

            useEffect(() => {
                localStorage.setItem('nollies_customer_name', customerName);
                localStorage.setItem('nollies_customer_phone', customerPhone);
                localStorage.setItem('nollies_customer_address', deliveryAddress);
            }, [customerName, customerPhone, deliveryAddress]);

            useEffect(() => {
                if (chatEndRef.current) {
                    chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [aiMessages, isAiOpen]);

            useEffect(() => {
                const greetings = [
                    "Sawubona, Mzansi! Welcome to Nollie's Hub",
                    "eNanda's Premier Digital & Grocery Marketplace",
                    "Experience Dynamic Durban Shopping & Delivery",
                    "Order Bulk Hampers & Luxury Perfumes Instantly"
                ];
                let idx = 0;
                const timer = setInterval(() => {
                    idx = (idx + 1) % greetings.length;
                    setDynamicGreeting(greetings[idx]);
                }, 3500);
                return () => clearInterval(timer);
            }, []);

            const fetchOrders = () => {
                fetch('/api/orders')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.orders) {
                            setOrders(data.orders);
                            localStorage.setItem('nollies_orders', JSON.stringify(data.orders));
                        }
                    })
                    .catch(err => {
                        const local = JSON.parse(localStorage.getItem('nollies_orders') || '[]');
                        setOrders(local);
                    });
            };

            const fetchBookings = () => {
                fetch('/api/bookings')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.bookings) setBookings(data.bookings);
                    })
                    .catch(err => console.error(err));
            };

            useEffect(() => {
                fetchOrders();
                fetchBookings();
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const addToCart = (title, price) => {
                setCart([...cart, { title, price }]);
                showToast(`🛒 ${title} added to cart`);
            };

            const removeFromCart = (index) => {
                const newCart = [...cart];
                newCart.splice(index, 1);
                setCart(newCart);
                showToast('Item removed from cart.');
            };

            const handleHamperToggle = (name) => {
                if (selectedHamperItems.includes(name)) {
                    setSelectedHamperItems(selectedHamperItems.filter(i => i !== name));
                } else {
                    if (selectedHamperItems.length >= 5) {
                        alert('Maximum 5 items allowed for custom hampling.');
                        return;
                    }
                    setSelectedHamperItems([...selectedHamperItems, name]);
                }
            };

            const addCustomHamper = () => {
                if (selectedHamperItems.length < 5) {
                    alert('Please select exactly 5 items to assemble your custom bundle!');
                    return;
                }
                addToCart(`Custom Hamper (${selectedHamperItems.join(', ')})`, 250);
                setSelectedHamperItems([]);
                setActiveTab('catalog');
            };

            const applyPromo = () => {
                if (promoCode.trim().toUpperCase() === 'NOLLIE10') {
                    setDiscountPercent(10);
                    showToast('🎉 Promo code verified: 10% Off!');
                } else {
                    alert('Invalid promo code!');
                }
            };

            const handleAddReview = (e) => {
                e.preventDefault();
                if (!newReviewName.trim() || !newReviewComment.trim()) {
                    alert('Please fill in your name and review comment.');
                    return;
                }
                const newRev = {
                    id: reviews.length + 1,
                    name: newReviewName,
                    rating: Number(newReviewRating),
                    comment: newReviewComment,
                    date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
                };
                setReviews([newRev, ...reviews]);
                setNewReviewName('');
                setNewReviewComment('');
                showToast('⭐ Thank you! Your review was published successfully.');
            };

            const handleAddCommunityPost = (e) => {
                e.preventDefault();
                if (!newPostAuthor.trim() || !newPostMsg.trim()) {
                    alert('Please enter your name and message.');
                    return;
                }
                const post = {
                    id: communityPosts.length + 1,
                    author: newPostAuthor,
                    msg: newPostMsg,
                    time: 'Just now'
                };
                setCommunityPosts([post, ...communityPosts]);
                setNewPostAuthor('');
                setNewPostMsg('');
                showToast('💬 Posted to eNanda Community Board!');
            };

            const shareCartToWhatsApp = () => {
                if (cart.length === 0) {
                    alert('Your cart is empty to share!');
                    return;
                }
                let text = `Sawubona Nollie's! Here is my shopping wishlist:%0A`;
                cart.forEach(i => text += `• ${i.title} - R${i.price}%0A`);
                text += `%0ATotal Items: ${cart.length}%0APlease assist with dispatch in eNanda/Durban!`;
                window.open(`https://wa.me/27625873479?text=${text}`, '_blank');
            };

            const handleQuestionnaireSubmit = (e) => {
                e.preventDefault();
                setQuestionnaireSubmitted(true);
                showToast('🎉 Questionnaire submitted! Use promo code NOLLIE10 for 10% off.');
            };

            const handleAiSend = (e) => {
                e.preventDefault();
                if (!aiInput.trim()) return;
                const userText = aiInput.trim();
                const newMessages = [...aiMessages, { sender: 'user', text: userText }];
                setAiMessages(newMessages);
                setAiInput('');

                setTimeout(() => {
                    let reply = "I can assist you with that! Feel free to explore our Cereal Hampers, Family Bulk Grocery Hampers, and M-Scents perfumes. Flat R30 delivery across Durban and eNanda!";
                    const lower = userText.toLowerCase();

                    if (lower.includes('price') || lower.includes('cost') || lower.includes('how much')) {
                        reply = "Our Cereal Hampers are R250, Family Bulk Hampers are R380, Juices Africa 4L is R160, and M-Scents perfumes are R120. Delivery across Durban & eNanda is a flat R30!";
                    } else if (lower.includes('delivery') || lower.includes('deliver') || lower.includes('durban') || lower.includes('enanda')) {
                        reply = "Yes! We deliver directly across eNanda, Durban CBD, and surrounding KZN areas with a flat R30 delivery fee.";
                    } else if (lower.includes('perfume') || lower.includes('scent') || lower.includes('m-scents')) {
                        reply = "Our M-Scents luxury 40ml perfumes are R120 each or grab our Duo Gift Set for R192!";
                    } else if (lower.includes('flash') || lower.includes('deal') || lower.includes('discount')) {
                        reply = "Check out our Flash Deals section on the Home tab for limited-time price drops!";
                    } else if (lower.includes('contact') || lower.includes('phone') || lower.includes('whatsapp') || lower.includes('owner')) {
                        reply = "You can reach Nollie's Durban Hub team directly via WhatsApp or phone at +27 62 587 3479.";
                    }

                    setAiMessages([...newMessages, { sender: 'ai', text: reply }]);
                }, 600);
            };

            const handleQuickTrack = (e) => {
                e.preventDefault();
                if (!quickTrackId.trim()) return;
                const found = orders.find(o => String(o.id) === String(quickTrackId.trim()));
                if (found) {
                    setTrackResult(`Order #${found.id}: Dispatched to ${found.customer_name || 'Client'} (${found.payment_status}) ✅`);
                } else {
                    setTrackResult(`Order #${quickTrackId} is being processed dynamically by Nollie's team 🚚`);
                }
            };

            const subtotal = cart.reduce((sum, item) => sum + item.price, 0);
            const discount = (subtotal * discountPercent) / 100;
            const deliveryFee = 30;
            const grandTotal = cart.length > 0 ? (subtotal - discount) + deliveryFee : 0;

            const handleCheckout = () => {
                if (cart.length === 0) {
                    alert('Your cart is empty!');
                    return;
                }

                if (!customerName.trim() || !customerPhone.trim()) {
                    alert('Please provide your Full Name and Contact Phone Number to complete payment.');
                    return;
                }

                const orderPayload = {
                    customer_name: customerName,
                    customer_phone: customerPhone,
                    comm_preference: commPreference,
                    delivery_address: deliveryAddress,
                    items: [...cart],
                    payment_method: paymentMethod,
                    payment_status: paymentMethod === 'COD' ? 'Pending (COD)' : 'Verified (Instant Gateway)',
                    total: grandTotal
                };

                fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                })
                .then(res => res.json())
                .then(data => {
                    if (data && data.order) {
                        const updated = [data.order, ...orders];
                        setOrders(updated);
                        localStorage.setItem('nollies_orders', JSON.stringify(updated));
                    }
                })
                .catch(err => {
                    const localFallback = { 
                        id: orders.length + 1, 
                        date: new Date().toLocaleString(), 
                        customer_name: customerName,
                        customer_phone: customerPhone,
                        comm_preference: commPreference,
                        delivery_address: deliveryAddress,
                        items: [...cart],
                        payment_method: paymentMethod,
                        payment_status: paymentMethod === 'COD' ? 'Pending (COD)' : 'Verified (Instant Gateway)',

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <input type="text" value={customerName} onChange={(e) => setCustomerName(e.target.value)} placeholder="Full Name *" className="px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-white"/>
                                            <input type="tel" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} placeholder="Phone Number (e.g. 0625873479) *" className="px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-white"/>
                                        </div>
                                        <input type="text" value={deliveryAddress} onChange={(e) => setDeliveryAddress(e.target.value)} placeholder="eNanda / Durban Street Address" className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-white"/>

                                        <div className="space-y-2 pt-2 border-t border-white/20">
                                            <span className="text-white font-extrabold block font-display">💳 Payment Method:</span>
                                            <div className="grid grid-cols-3 gap-2">
                                                <button onClick={() => setPaymentMethod('COD')} className={`p-2.5 rounded-xl border text-[11px] font-bold text-center transition-all ${paymentMethod === 'COD' ? 'bg-white text-slate-950 border-white shadow-md' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>💵 Cash on Delivery</button>
                                                <button onClick={() => setPaymentMethod('CAPITEC_PAY')} className={`p-2.5 rounded-xl border text-[11px] font-bold text-center transition-all ${paymentMethod === 'CAPITEC_PAY' ? 'bg-slate-200 text-slate-950 border-white shadow-md' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>📲 Capitec / EFT</button>
                                                <button onClick={() => setPaymentMethod('CARD_ONLINE')} className={`p-2.5 rounded-xl border text-[11px] font-bold text-center transition-all ${paymentMethod === 'CARD_ONLINE' ? 'bg-slate-300 text-slate-950 border-white shadow-md' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>💳 Online Card</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="py-3 border-t border-white/20 flex space-x-2.5">
                                    <input type="text" value={promoCode} onChange={(e) => setPromoCode(e.target.value)} placeholder="Promo code (NOLLIE10)" className="flex-1 px-4 py-3 text-xs rounded-xl bg-slate-900 border border-slate-700 text-white uppercase outline-none"/>
                                    <button onClick={applyPromo} className="press-effect white-rainbow-btn text-slate-950 text-xs font-black px-5 py-3 rounded-xl shadow">Apply</button>
                                </div>

                                <div className="border-t border-white/20 pt-4 space-y-2.5 text-xs">
                                    <div className="flex justify-between text-slate-300 font-medium font-mono"><span>Subtotal:</span><span>R {subtotal.toFixed(2)}</span></div>
                                    <div className="flex justify-between text-slate-300 font-medium font-mono"><span>Discount:</span><span className="text-white">-R {discount.toFixed(2)}</span></div>
                                    <div className="flex justify-between text-slate-300 font-medium font-mono"><span>Delivery Fee (Durban/eNanda):</span><span>R 30.00</span></div>
                                    <div className="flex justify-between text-lg font-black text-white pt-2 border-t border-white/20"><span>Total:</span><span className="text-white font-mono font-extrabold">R {grandTotal.toFixed(2)}</span></div>
                                    <button onClick={handleCheckout} className="press-effect w-full white-rainbow-btn text-slate-950 font-extrabold py-4 rounded-2xl text-sm shadow-xl mt-2 flex items-center justify-center space-x-2 hover:scale-[1.01] transition-transform">
                                        <span>Pay R{grandTotal.toFixed(2)} & Complete Order 🚀</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeModalProduct && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="rainbow-glass rounded-3xl p-6 sm:p-8 border border-white/40 max-w-md w-full space-y-5 shadow-2xl">
                                <div className="flex justify-between items-center border-b border-white/20 pb-4">
                                    <h3 className="text-base font-black text-white font-display">{activeModalProduct.title}</h3>
                                    <button onClick={() => setActiveModalProduct(null)} className="press-effect text-slate-400 text-xl font-bold bg-slate-900 w-9 h-9 rounded-full flex items-center justify-center hover:bg-slate-800">&times;</button>
                                </div>
                                <img src={activeModalProduct.img} alt="Product" className="w-full h-52 object-cover rounded-2xl bg-slate-900 border border-slate-800 opacity-95" onError={(e)=>{e.target.onerror=null; e.target.src=FALLBACK_SVG;}}/>
                                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed font-medium">{activeModalProduct.desc}</p>
                                <div className="flex justify-between items-center pt-4 border-t border-white/20">
                                    <span className="text-xl font-black text-white font-mono">R {activeModalProduct.price.toFixed(2)}</span>
                                    <button onClick={() => { addToCart(activeModalProduct.title, activeModalProduct.price); setActiveModalProduct(null); }} className="press-effect white-rainbow-btn text-slate-950 font-extrabold px-6 py-3.5 rounded-2xl text-xs shadow-xl hover:scale-105 transition-transform">+ Add to Cart</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toastMessage && (
                        <div className="fixed bottom-6 left-6 rainbow-glass border border-white text-white text-xs font-black px-6 py-4 rounded-2xl shadow-xl z-50 animate-fade-in font-mono">
                            {toastMessage}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
