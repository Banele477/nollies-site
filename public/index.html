<html lang="en" class="scroll-smooth dark">

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #030712;
            color: #f8fafc;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, .font-display { font-family: 'Space Grotesk', sans-serif; }
        
        .vr-universe-bg {
            background-color: #030712;
            background-image: 
                radial-gradient(at 15% 15%, rgba(56, 189, 248, 0.22) 0px, transparent 50%),
                radial-gradient(at 85% 20%, rgba(168, 85, 247, 0.22) 0px, transparent 50%),
                radial-gradient(at 50% 60%, rgba(16, 185, 129, 0.18) 0px, transparent 60%),
                radial-gradient(at 90% 90%, rgba(244, 63, 94, 0.2) 0px, transparent 50%),
                linear-gradient(to bottom, #030712, #070913);
            background-attachment: fixed;
        }

        .vr-glass {
            background: rgba(10, 15, 30, 0.88);
            backdrop-filter: blur(50px) saturate(250%);
            -webkit-backdrop-filter: blur(50px) saturate(250%);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 45px 100px -15px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .vr-card-hover {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .vr-card-hover:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 50px 120px -15px rgba(56, 189, 248, 0.4);
        }

        @keyframes vrGlowText {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .vr-animated-text {
            background: linear-gradient(135deg, #ffffff, #38bdf8, #34d399, #fbbf24, #f43f5e, #a855f7, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: vrGlowText 8s linear infinite;
        }

        .vr-btn {
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 20%, #38bdf8 40%, #10b981 60%, #a855f7 80%, #f43f5e 100%);
            background-size: 250% auto;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            color: #030712;
            font-weight: 900;
            box-shadow: 0 8px 35px rgba(56, 189, 248, 0.5);
        }
        .vr-btn:hover {
            background-position: right center;
            box-shadow: 0 14px 50px rgba(56, 189, 248, 0.9);
            transform: translateY(-3px) scale(1.04);
            color: #ffffff;
        }

        @keyframes pulseHMD {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 30px rgba(56,189,248,0.9)); }
        }
        .hmd-pulse {
            animation: pulseHMD 3.5s ease-in-out infinite;
        }

        @keyframes xrDrop {
            0% { transform: translateY(-30px) scale(0.5); opacity: 0; }
            70% { transform: translateY(5px) scale(1.04); opacity: 1; }
            100% { transform: translateY(0px) scale(1); opacity: 1; }
        }

        .xr-pill {
            position: relative;
            border-radius: 9999px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(10, 15, 30, 0.92));
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 45px -5px rgba(0, 0, 0, 0.8), inset 0 2px 6px rgba(255, 255, 255, 0.5);
            animation: xrDrop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.3) both;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .xr-pill:hover {
            transform: translateY(-6px) scale(1.08);
            border-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 25px 60px rgba(56, 189, 248, 0.6), inset 0 2px 10px rgba(255, 255, 255, 0.9);
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.35), rgba(30, 41, 59, 0.98));
        }
        .xr-pill-active {
            background: linear-gradient(135deg, #ffffff 0%, #38bdf8 35%, #10b981 70%, #a855f7 100%);
            color: #030712 !important;
            font-weight: 900;
            border: 1px solid #ffffff;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.9), inset 0 2px 8px rgba(255, 255, 255, 1);
            transform: scale(1.12) translateY(-4px);
        }

        .marquee-container { overflow: hidden; white-space: nowrap; position: relative; width: 100%; }
        .marquee-track { display: inline-block; animation: marqueeScroll 25s linear infinite; }
        .marquee-track-reverse { display: inline-block; animation: marqueeScrollReverse 22s linear infinite; }
        @keyframes marqueeScroll { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
        @keyframes marqueeScrollReverse { 0% { transform: translateX(-50%); } 100% { transform: translateX(0%); } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

                    const geom = geometries[Math.floor(Math.random() * geometries.length)];
                    const mat = materials[Math.floor(Math.random() * materials.length)];
                    const mesh = new THREE.Mesh(geom, mat);

                    mesh.position.set(
                        (Math.random() - 0.5) * 16,
                        (Math.random() - 0.5) * 8,
                        (Math.random() - 0.5) * 16 - 4
                    );
                    mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                    group.add(mesh);
                    meshes.push(mesh);
                }

                // Grid Floor
                const grid = new THREE.GridHelper(30, 30, 0x38bdf8, 0x1e293b);
                grid.position.y = -2;
                scene.add(grid);

                let reqId;
                const animate = () => {
                    reqId = requestAnimationFrame(animate);
                    group.rotation.y += 0.003;
                    meshes.forEach((m, idx) => {
                        m.rotation.x += 0.01 * (idx % 2 === 0 ? 1 : -1);
                        m.rotation.y += 0.015;
                    });
                    renderer.render(scene, camera);

                    if (!container) return;
                    camera.aspect = container.clientWidth / container.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(container.clientWidth, container.clientHeight);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    cancelAnimationFrame(reqId);
                    window.removeEventListener('resize', handleResize);

                                        src={arProduct.img} 
                                        alt={arProduct.title} 
                                        style={{ transform: `scale(${arZoom}) rotate(${arRotation}deg)`, transition: 'transform 0.2s ease-out' }}
                                        className="w-48 h-48 object-cover rounded-2xl shadow-2xl border border-white/40"
                                    />
                                    <div className="absolute bottom-3 left-3 bg-slate-900/90 border border-white/20 px-3 py-1.5 rounded-xl text-[10px] font-mono text-white">
                                        🔄 Rotate: {arRotation}° | 🔍 Zoom: {arZoom.toFixed(1)}x
                                    </div>
                                </div>

                                <div className="grid grid-cols-3 gap-3 text-xs">
                                    <button onClick={() => setArRotation(prev => prev + 45)} className="press-effect bg-slate-900 border border-white/30 py-3 rounded-xl font-bold text-white hover:bg-slate-800 shadow transition-all duration-300 hover:scale-105">Rotate ↻</button>
                                    <button onClick={() => setArZoom(prev => Math.min(prev + 0.2, 1.8))} className="press-effect bg-slate-900 border border-white/30 py-3 rounded-xl font-bold text-white hover:bg-slate-800 shadow transition-all duration-300 hover:scale-105">Zoom In 🔍+</button>
                                    <button onClick={() => setArZoom(prev => Math.max(prev - 0.2, 0.8))} className="press-effect bg-slate-900 border border-white/30 py-3 rounded-xl font-bold text-white hover:bg-slate-800 shadow transition-all duration-300 hover:scale-105">Zoom Out 🔍-</button>
                                </div>

                                <div className="flex justify-between items-center pt-3 border-t border-white/20">
                                    <span className="text-lg font-black text-white font-mono">R {arProduct.price.toFixed(2)}</span>
                                    <button onClick={() => { addToCart(arProduct.title, arProduct.price); setArProduct(null); }} className="press-effect vr-btn text-slate-950 font-extrabold px-6 py-3 rounded-2xl text-xs shadow-xl transition-all duration-300 hover:scale-105">+ Add to Cart 🛒</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* DYNAMIC POSTER INSPECTOR MODAL */}
                    {activePoster && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="vr-glass rounded-3xl p-6 sm:p-8 border border-white/40 max-w-lg w-full space-y-5 shadow-2xl relative">
                                <button onClick={() => setActivePoster(null)} className="absolute top-4 right-4 text-slate-400 text-xl font-bold bg-slate-900 w-9 h-9 rounded-full flex items-center justify-center hover:bg-slate-800 transition-colors">&times;</button>
                                <div className="space-y-2">
                                    <span className="bg-sky-500/20 text-sky-300 border border-sky-400/40 text-[10px] font-mono px-3 py-1 rounded-full uppercase font-bold">{activePoster.tag}</span>
                                    <h3 className="text-xl font-black text-white font-display">{activePoster.title}</h3>
                                </div>
                                <div className="h-72 rounded-2xl overflow-hidden border border-white/20 bg-slate-900 shadow-inner">
                                    <img src={activePoster.img} alt={activePoster.title} className="w-full h-full object-cover transition-transform duration-700 hover:scale-105"/>
                                </div>
                                <p className="text-xs text-slate-300 leading-relaxed font-medium">{activePoster.desc}</p>
                                <div className="flex justify-between items-center pt-3 border-t border-white/20">
                                    <span className="text-lg font-black text-white font-mono">{activePoster.price}</span>
                                    <button onClick={() => { addToCart(activePoster.title, 250); setActivePoster(null); }} className="press-effect vr-btn text-slate-950 font-extrabold px-6 py-3 rounded-2xl text-xs shadow-xl transition-all duration-300 hover:scale-105">+ Order Package 🛒</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SA POPIA COOKIE CONSENT BANNER */}
                    {!popiaAccepted && (
                        <div className="fixed bottom-0 inset-x-0 z-50 bg-slate-950/95 border-t border-white/30 p-4 sm:p-5 shadow-2xl backdrop-blur-lg animate-fade-in">
                            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 text-xs">
                                <div className="space-y-1 text-center sm:text-left">
                                    <span className="font-extrabold text-white font-display flex items-center gap-1.5 justify-center sm:justify-start"><span>🇿🇦</span><span>POPIA Data Privacy Notice</span></span>
                                    <p className="text-slate-300">Nollie's VR Metaverse processes personal details solely for dispatching Durban hampers in compliance with the Protection of Personal Information Act (POPIA).</p>
                                </div>
                                <button onClick={acceptPopia} className="press-effect vr-btn text-slate-950 text-xs font-black px-6 py-3 rounded-xl shadow-lg whitespace-nowrap transition-all duration-300 hover:scale-105">Accept & Continue 🔒</button>
                            </div>
                        </div>
                    )}

                    {/* 24/7 AI VR STRATEGIC ASSISTANT CHAT WIDGET */}
                    <div className="fixed bottom-6 right-6 z-50 flex flex-col items-end">
                        {isAiOpen && (
                            <div className="vr-glass border border-white/40 rounded-3xl w-80 sm:w-96 h-[450px] shadow-2xl flex flex-col mb-4 overflow-hidden animate-fade-in">
                                <div className="bg-slate-950/95 p-4 border-b border-white/25 flex justify-between items-center">
                                    <div className="flex items-center space-x-2.5">
                                        <span className="relative flex h-3 w-3">
                                          <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
                                          <span className="relative inline-flex rounded-full h-3 w-3 bg-sky-400"></span>
                                        </span>
                                        <div>
                                            <h4 className="text-xs font-black text-white font-display uppercase tracking-wider">Nollie VR Strategic AI</h4>
                                            <span className="text-[10px] text-sky-400 font-mono">Online 24/7 • Metaverse Hub</span>
                                        </div>
                                    </div>
                                    <button onClick={() => setIsAiOpen(false)} className="text-slate-400 hover:text-white text-lg font-bold w-7 h-7 bg-slate-900 rounded-full flex items-center justify-center transition-colors">&times;</button>
                                </div>

                                <div className="flex-1 p-4 overflow-y-auto space-y-3 text-xs bg-slate-950/60">
                                    {aiMessages.map((msg, i) => (
                                        <div key={i} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[80%] p-3 rounded-2xl leading-relaxed transition-all ${msg.sender === 'user' ? 'bg-white text-slate-950 font-bold rounded-br-none shadow-md' : 'bg-slate-900 text-slate-200 border border-white/20 rounded-bl-none shadow-sm font-medium'}`}>
                                                {msg.text}
                                            </div>
                                        </div>
                                    ))}
                                    <div ref={chatEndRef} />
                                </div>

                                <form onSubmit={handleAiSend} className="p-3 bg-slate-950/95 border-t border-white/25 flex gap-2">
                                    <input type="text" value={aiInput} onChange={(e) => setAiInput(e.target.value)} placeholder="Ask about VR worlds, AI matcher..." 
                                           className="flex-1 px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs outline-none focus:border-white transition-all"/>
                                    <button type="submit" className="press-effect vr-btn px-4 py-2.5 rounded-xl text-xs font-black shadow transition-all duration-300 hover:scale-105">Send</button>
                                </form>
                            </div>
                        )}

                        <button onClick={() => setIsAiOpen(!isAiOpen)} className="press-effect vr-btn p-4 rounded-full shadow-2xl flex items-center justify-center space-x-2 text-slate-950 font-black hover:scale-110 transition-all duration-300 hmd-pulse">
                            <span className="text-xl">🥽</span>
                            {!isAiOpen && <span className="text-xs font-mono pr-1">Ask VR AI</span>}
                        </button>
                    </div>

                    {isCartOpen && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex flex-col justify-end animate-fade-in">
                            <div className="vr-glass rounded-t-3xl p-6 sm:p-8 border-t border-white/30 max-h-[90vh] flex flex-col shadow-2xl max-w-2xl mx-auto w-full">
                                <div className="flex justify-between items-center border-b border-white/20 pb-4">
                                    <h3 className="font-black text-base text-white flex items-center space-x-2 font-display"><span>🛒</span><span>VR Cart & Strategic Payment Gateway</span></h3>
                                    <button onClick={() => setIsCartOpen(false)} className="press-effect text-slate-400 text-xl font-bold bg-slate-900 w-9 h-9 rounded-full flex items-center justify-center hover:bg-slate-800 transition-colors">&times;</button>
                                </div>
                                <div className="py-4 overflow-y-auto flex-1 space-y-4 text-xs">
                                    <div className="space-y-2">
                                        <div className="flex justify-between items-center">
                                            <span className="text-slate-400 font-bold uppercase text-[10px] font-mono">Cart Contents:</span>
                                            <button onClick={shareCartToWhatsApp} className="press-effect bg-emerald-600/30 border border-emerald-500/50 text-emerald-300 text-[10px] font-bold px-3 py-1 rounded-xl shadow transition-all duration-300 hover:scale-105">Share Cart to WhatsApp 📲</button>
                                        </div>
                                        {cart.length === 0 ? (
                                            <p className="text-slate-400 italic">Your cart is empty.</p>
                                        ) : (
                                            cart.map((item, idx) => (
                                                <div key={idx} className="flex justify-between items-center bg-slate-950/90 p-3 rounded-2xl border border-white/20 text-slate-200 vr-card-hover">
                                                    <div><div className="font-extrabold text-white">{item.title}</div><div className="text-white font-mono text-[11px]">R {item.price.toFixed(2)}</div></div>
                                                    <button onClick={() => removeFromCart(idx)} className="text-red-400 font-bold bg-slate-900 w-7 h-7 rounded-full flex items-center justify-center transition-transform hover:scale-110">✕</button>
                                                </div>
                                            ))
                                        )}
                                    </div>

                                    <div className="bg-slate-950/90 p-4 rounded-2xl border border-white/20 space-y-3">
                                        <span className="text-white font-extrabold block font-display">👤 Delivery & Contact Info:</span>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <input type="text" value={customerName} onChange={(e) => setCustomerName(e.target.value)} placeholder="Full Name *" className="px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-white transition-all"/>
                                            <input type="tel" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} placeholder="Phone Number (e.g. 0625873479) *" className="px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-white transition-all"/>
                                        </div>
                                        <input type="text" value={deliveryAddress} onChange={(e) => setDeliveryAddress(e.target.value)} placeholder="eNanda / Durban Street Address" className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-white transition-all"/>

                                        <div className="space-y-2 pt-2 border-t border-white/20">
                                            <span className="text-white font-extrabold block font-display">💳 Payment Method:</span>
                                            <div className="grid grid-cols-3 gap-2">
                                                <button onClick={() => setPaymentMethod('COD')} className={`p-2.5 rounded-xl border text-[11px] font-bold text-center transition-all duration-300 ${paymentMethod === 'COD' ? 'bg-white text-slate-950 border-white shadow-md scale-105' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>💵 Cash on Delivery</button>
                                                <button onClick={() => setPaymentMethod('CAPITEC_PAY')} className={`p-2.5 rounded-xl border text-[11px] font-bold text-center transition-all duration-300 ${paymentMethod === 'CAPITEC_PAY' ? 'bg-slate-200 text-slate-950 border-white shadow-md scale-105' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>📲 Capitec / EFT</button>
                                                <button onClick={() => setPaymentMethod('CARD_ONLINE')} className={`p-2.5 rounded-xl border text-[11px] font-bold text-center transition-all duration-300 ${paymentMethod === 'CARD_ONLINE' ? 'bg-slate-300 text-slate-950 border-white shadow-md scale-105' : 'bg-slate-900 text-slate-400 border-slate-800'}`}>💳 Online Card</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="py-3 border-t border-white/20 flex space-x-2.5">
                                    <input type="text" value={promoCode} onChange={(e) => setPromoCode(e.target.value)} placeholder="Promo code (NOLLIE10)" className="flex-1 px-4 py-3 text-xs rounded-xl bg-slate-900 border border-slate-700 text-white uppercase outline-none transition-all"/>
                                    <button onClick={applyPromo} className="press-effect vr-btn text-slate-950 text-xs font-black px-5 py-3 rounded-xl shadow transition-all duration-300 hover:scale-105">Apply</button>
                                </div>

                                <div className="border-t border-white/20 pt-4 space-y-2.5 text-xs">
                                    <div className="flex justify-between text-slate-300 font-medium font-mono"><span>Subtotal:</span><span>R {subtotal.toFixed(2)}</span></div>
                                    <div className="flex justify-between text-slate-300 font-medium font-mono"><span>Discount:</span><span className="text-white">-R {discount.toFixed(2)}</span></div>
                                    <div className="flex justify-between text-slate-300 font-medium font-mono"><span>Delivery Fee (Durban/eNanda):</span><span>R 30.00</span></div>
                                    <div className="flex justify-between text-lg font-black text-white pt-2 border-t border-white/20"><span>Total:</span><span className="text-white font-mono font-extrabold">R {grandTotal.toFixed(2)}</span></div>
                                    <button onClick={handleCheckout} className="press-effect w-full vr-btn text-slate-950 font-extrabold py-4 rounded-2xl text-sm shadow-xl mt-2 flex items-center justify-center space-x-2 hover:scale-[1.01] transition-all duration-300">
                                        <span>Pay R{grandTotal.toFixed(2)} & Complete VR Order 🚀</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeModalProduct && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="vr-glass rounded-3xl p-6 sm:p-8 border border-white/40 max-w-md w-full space-y-5 shadow-2xl">
                                <div className="flex justify-between items-center border-b border-white/20 pb-4">
                                    <h3 className="text-base font-black text-white font-display">{activeModalProduct.title}</h3>
                                    <button onClick={() => setActiveModalProduct(null)} className="press-effect text-slate-400 text-xl font-bold bg-slate-900 w-9 h-9 rounded-full flex items-center justify-center hover:bg-slate-800 transition-colors">&times;</button>
                                </div>
                                <img src={activeModalProduct.img} alt="Product" className="w-full h-52 object-cover rounded-2xl bg-slate-900 border border-slate-800 opacity-95 transition-transform duration-700 hover:scale-105" onError={(e)=>{e.target.onerror=null; e.target.src=FALLBACK_SVG;}}/>
                                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed font-medium">{activeModalProduct.desc}</p>
                                <div className="flex justify-between items-center pt-4 border-t border-white/20">
                                    <span className="text-xl font-black text-white font-mono">R {activeModalProduct.price.toFixed(2)}</span>
                                    <div className="flex gap-2">
                                        <button onClick={() => { setActiveModalProduct(null); setArProduct(activeModalProduct); setArZoom(1); setArRotation(0); }} className="press-effect bg-slate-900 border border-white/40 text-white font-bold px-4 py-3 rounded-2xl text-xs shadow transition-all duration-300 hover:scale-105">3D VR View 🥽</button>
                                        <button onClick={() => { addToCart(activeModalProduct.title, activeModalProduct.price); setActiveModalProduct(null); }} className="press-effect vr-btn text-slate-950 font-extrabold px-5 py-3 rounded-2xl text-xs shadow-xl transition-all duration-300 hover:scale-105">+ Add</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {toastMessage && (
                        <div className="fixed bottom-6 left-6 vr-glass border border-sky-400 text-white text-xs font-black px-6 py-4 rounded-2xl shadow-xl z-50 animate-fade-in font-mono hmd-pulse">
                            {toastMessage}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
