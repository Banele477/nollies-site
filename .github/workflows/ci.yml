name: Nollies CI/CD
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify Syntax
        run: |
          python -m py_compile server.py generate_sitemap.py
          python generate_sitemap.py
          echo "[+] Build check passed!"
